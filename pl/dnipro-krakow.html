<script>
    const SPLIT = []; /* [станция пересадки, заголовок, пограничный контроль]: страница делится на группы по пересадке */
    const FROM = "Днепр", TO = "Краков", BACK = "pl-ua"; // FROM/TO: русские названия, как в шапке карточки в админке
    
    const BUY = `<section class="panel"><h2>Jak kupić bilety</h2>
<div class="buy one">

<!--T--><div><h3>Z przesiadką w Przemyślu</h3><ol class="steps">
<li>Otwórz aplikację Ukrzaliznytsia, wybierz trasę Dnipro → Przemyśl i datę podróży. Sprzedaż biletów rusza na 20 dni przed odjazdem o 9:00 czasu kijowskiego. Wybierz pociąg i opłać bilet.</li>
<li>Bilet na pociąg Przemyśl → Kraków kup osobno u polskiego przewoźnika PKP Intercity — na stronie intercity.pl lub w aplikacji PKP Intercity. Można go też kupić na koleo.pl lub w aplikacji KOLEO.</li>

<li>Po zakupie zapisz oba e-bilety w telefonie. Przed podróżą sprawdź daty, godziny odjazdu i stacje docelowe.</li></ol>
<a class="btn pri" href="https://app.uz.gov.ua/start" target="_blank" rel="noopener">Kup w aplikacji UZ bilet Dnipro → Przemyśl</a>
<a class="btn" href="https://www.intercity.pl/" target="_blank" rel="noopener">Kup na stronie PKP Intercity bilet Przemyśl → Kraków</a></div><!--/T-->



</div>
<p class="buy-note">Rozkłady jazdy mogą ulec zmianie. Aktualne informacje znajdziesz w aplikacji UZ i na stronie PKP Intercity.</p></section>`;
    const app = document.getElementById("app");
    const norm = s => String(s || "").trim().toLowerCase();
    fetch(U + "/rest/v1/options?order=sort", {headers: {apikey: K, Authorization: "Bearer " + K}}).then(r => {
        if (!r.ok) throw 0;
        return r.json()
    }).then(all => {
        const list = all.filter(o => o.active !== false).map(o => {
            const p = parseOption(o.dsl);
            return {o, p, h: p.head || deriveHead(p.legs)}
        }).filter(x => x.p.legs.length && norm(x.h.from).startsWith(norm(FROM)) && norm(x.h.to).startsWith(norm(TO)));
        const HAS_DIRECT = false; /* false: страница без прямого поезда, все варианты идут как «с пересадкой» */
        /* LEADX: если среди вариантов есть пересадка на этой станции, подзаголовок страницы берётся из LEADM (с этой станцией) */
        const LEADX = "", LEADM = "";
        if (LEADX && LEADM && list.some(x => x.p.legs.length > 1 && (s => norm(s[s.length - 1].name).startsWith(norm(LEADX)))(x.p.legs[0].stops))) document.getElementById("lead").textContent = LEADM;
        const direct = HAS_DIRECT ? list.filter(x => x.p.legs.length === 1) : [], transfer = HAS_DIRECT ? list.filter(x => x.p.legs.length > 1) : list;
        /* блоки покупки: вариант ищем по перевозчику чешского поезда (EC/IC = ČD, RJ = RegioJet) и станции пересадки;
           время и номер поезда УЗ берём из остановок варианта, а не из шапки, чтобы не зависеть от ручных правок */
        const tm = s => (String(s).match(/\d{1,2}:\d{2}/) || [""])[0], isUz = L => !/^[A-Za-z]/.test(String(L.train).trim());
        const carOf = L => /^(EC|IC)\b/i.test(L.train.trim()) ? "cd" : /^RJ\b/i.test(L.train.trim()) ? "rj" : "";
        const blocks = [];
        document.querySelectorAll("#more h3[data-car]").forEach(h => {
            const x = list.find(x => {
                const L = x.p.legs, cz = L.find(l => !isUz(l)), s = L[0].stops;
                return L.length > 1 && cz && carOf(cz) === h.dataset.car && norm(s[s.length - 1].name).startsWith(norm(h.dataset.x))
            });
            if (!x) { blocks.push({blk: h.parentNode, k: [9, 0]}); return }
            const L = x.p.legs, last = L[L.length - 1].stops, ft = tm(L[0].stops[0].time) || x.h.ft, tt = tm(last[last.length - 1].time) || x.h.tt, u = L.find(isUz);
            h.insertAdjacentText("beforeend", " (" + h.dataset.dt.replace("{t1}", ft).replace("{t2}", tt) + ")");
            if (u) h.parentNode.querySelectorAll(".utr").forEach(e => e.textContent = String(u.train).trim().replace(/^№\s*/, "").toUpperCase());
            const g = SPLIT.findIndex(s => norm(L[0].stops[L[0].stops.length - 1].name).startsWith(norm(s[0])));
            blocks.push({blk: h.parentNode, k: [g < 0 ? 8 : g, list.indexOf(x)]})
        });
        /* блоки покупки идут в том же порядке, что и варианты на странице: сначала группы по пересадке, внутри — как в базе */
        if (blocks.length) {
            const box = blocks[0].blk.parentNode;
            blocks.map((b, i) => Object.assign({i}, b)).sort((a, b) => a.k[0] - b.k[0] || a.k[1] - b.k[1] || a.i - b.i).forEach(b => box.appendChild(b.blk))
        }
        if (!list.length) {
            app.innerHTML = `<div class="panel"><h2>Brak połączeń</h2><p>Dodaj je w panelu administratora.</p></div>`;
            return
        }
        app.innerHTML = ""
            + (() => {
            const block = (arr, h, b) => arr.length ? `<h2 class="sub${arr.length === 1 ? " c" : ""}">${h}</h2><div class="cols${arr.length === 1 ? " one" : ""}"${b ? ' data-b="1"' : ""} style="margin-top:16px">${arr.map(x => optHtml(x.o)).join("")}</div>` : "";
            if (!SPLIT.length) return block(transfer, "Z przesiadką w Przemyślu");
            const at = x => { const s = x.p.legs[0].stops; return norm(s[s.length - 1].name) }; /* станция первой пересадки */
            const used = new Set();
            const parts = SPLIT.map(s => { const g = transfer.filter(x => at(x).startsWith(norm(s[0]))); g.forEach(x => used.add(x)); return block(g, esc(s[1]), s[2]) });
            return parts.join("") + block(transfer.filter(x => !used.has(x)), "Z przesiadką w Przemyślu")
        })();
        
        /*B*/document.querySelectorAll((SPLIT.length ? ".cols[data-b] " : "") + ".swap").forEach(s => s.insertAdjacentHTML("afterend", `<div class="swap border">🛂 Po przyjeździe do Przemyśla odbywa się kontrola graniczna</div>`));/*/B*/
    }).catch(() => {
        app.innerHTML = `<div class="panel"><h2>Nie udało się załadować danych</h2><p>Odśwież stronę później.</p></div>`
    });
    const here = location.pathname.split("/").pop() || "index.html",
        others = ((window.CFG && CFG.PAGES) || []).filter(p => p.href !== here);
    document.getElementById("more").innerHTML = BUY + `<section class="panel"><h2>Inne trasy</h2><div class="grid" style="margin-top:12px"><a class="btn" href="./#${BACK}">← Polska — Ukraina</a>${others.map(p => `<a class="btn" href="${esc(p.href)}">${esc(trRoute(p.title))}</a>`).join("")}<a class="btn" href="./">Wszystkie kraje</a></div></section>`;
</script>

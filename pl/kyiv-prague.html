    <style>
        .wrap {
            max-width: 1080px
        }

        .cols {
            display: grid;
            grid-template-columns:repeat(2, minmax(0, 1fr));
            gap: 18px
        }

        .cols .opt {
            margin-top: 0
        }

        /* один вариант: карточка и заголовок по центру */
        .cols.one {
            grid-template-columns: minmax(0, 640px);
            justify-content: center
        }

        h2.sub.c {
            text-align: center
        }

        .cols .board, .direct .board {
            --t: clamp(32px, 4vw, 46px)
        }

        .direct .opt {
            margin-top: 0
        }

        /* прямой поезд: зелёный цвет вместо синего */
        .direct .board {
            background: linear-gradient(160deg, #12875a, #0a4d34)
        }

        .direct .opt {
            border-color: #12875a;
            box-shadow: 0 14px 36px -14px rgba(18, 135, 90, .55)
        }

        }

        .direct .leg h4 {
            color: #0a6b46;
            background: #dcf5e9
        }

        .direct .tag {
            background: var(--acc);
            color: var(--accink)
        }

        @media (prefers-color-scheme: dark) {
            .direct .leg h4 {
                color: #7be0b0;
                background: #12392b
            }
        }

        .direct .body.two {
            display: grid;
            grid-template-columns:minmax(0, 1fr) minmax(0, 1fr);
            gap: 0 28px;
            align-items: start
        }

        .direct .body.two .note {
            grid-column: 1/-1
        }

        .coach {
            grid-column: 2;
            grid-row: 1;
            margin-top: 16px;
            padding: 18px 20px;
            border-radius: 18px;
            background: #dcf5e9;
            color: #0a4d34;
            border: 1px solid rgba(18, 135, 90, .25)
        }

        .coach h4 {
            margin: 0 0 8px;
            font-family: var(--disp);
            font-weight: 800;
            font-size: 17px
        }

        .coach p {
            margin: 0;
            font-size: 15.5px;
            line-height: 1.6
        }

        .coach p + p {
            margin-top: 8px
        }

        @media (prefers-color-scheme: dark) {
            .coach {
                background: #12392b;
                color: #bff0d8;
                border-color: rgba(123, 224, 176, .25)
            }
        }

        .buy {
            display: grid;
            grid-template-columns:repeat(2, minmax(0, 1fr));
            gap: 18px;
            margin-top: 14px
        }

        .buy > div {
            background: var(--soft);
            border-radius: 18px;
            padding: 18px 20px
        }

        .buy > div.d {
            background: #dcf5e9;
            color: #0a4d34
        }

        .buy > div.d .steps li:before {
            background: #12875a;
            color: #fff
        }

        .buy h3 {
            margin: 0 0 2px;
            font-family: var(--disp);
            font-weight: 800;
            font-size: 17px
        }

        .buy .steps {
            margin-top: 12px
        }

        .buy .btn {
            margin-top: 14px
        }

        .buy .btn:not(.pri) {
            box-shadow: inset 0 0 0 2px var(--brand)
        }

        .buy > div.d .btn {
            background: #fff;
            color: #0a6b46;
            box-shadow: inset 0 0 0 2px #12875a
        }

        .buy > div:not(.d) .btn:not(.pri) {
            background: var(--brand);
            color: var(--card);
            box-shadow: none
        }

        .buy.one {
            grid-template-columns: minmax(0, 1fr)
        }

        .buy.three {
            grid-template-columns:repeat(3, minmax(0, 1fr))
        }

        .buy.two {
            grid-template-columns:repeat(2, minmax(0, 1fr))
        }

        @media (max-width: 980px) {
            .buy.two, .buy.three {
                grid-template-columns: minmax(0, 1fr)
            }
        }

        .buy-note {
            margin-top: 16px !important;
            font-size: 14px
        }

        @media (prefers-color-scheme: dark) {
            .buy > div.d {
                background: #12392b;
                color: #bff0d8
            }

            .buy > div.d .btn {
                background: #0f2c21;
                color: #7be0b0
            }
        }

        h2.sub small {
            font-family: var(--body);
            font-weight: 600;
            font-size: 14px;
            color: var(--mute);
            margin-left: 8px
        }

        .direct-wrap {
            display: grid;
            gap: 18px
        }

        @media (max-width: 760px) {
            .buy {
                grid-template-columns:1fr
            }

            .direct .body.two {
                display: block
            }

            .cols {
                grid-template-columns:1fr
            }

            .cols .board, .direct .board {
                --t: clamp(34px, 10vw, 60px)
            }
        }

<header>

        <h1>Pociągiem: Kijów → Praga</h1>
        <p id="lead">Rozkład pociągów Kijów — Praga: warianty z przesiadką w Czopie. Czas podróży, postoje i informacje o zakupie biletów.</p></div>
</header>

<script>window.LANG = "pl";</script>
<script src="../config.js"></script>
<script src="../i18n.js"></script>
<script src="../common.js"></script>
<script>
    const SPLIT = [["Перемышль","Z przesiadką w Przemyślu",1],["Чоп","Z przesiadką w Czopie",0]]; /* [станция пересадки, заголовок, пограничный контроль]: страница делится на группы по пересадке */
    const FROM = "Киев", TO = "Прага", BACK = "cz-ua"; // FROM/TO: русские названия, как в шапке карточки в админке
    
    const BUY = `<section class="panel"><h2>Jak kupić bilety</h2>
<div class="buy three">




<div><h3 data-tr="051К" data-dt="odjazd z Kijowa {t1}, przyjazd do Pragi {t2}">Z przesiadką w Przemyślu</h3><ol class="steps">
<li>Otwórz aplikację Ukrzaliznytsia, wybierz trasę Kijów → Przemyśl i datę podróży. Sprzedaż biletów rusza na 20 dni przed odjazdem o 08:00 czasu kijowskiego. Wybierz pociąg 051К i opłać bilet.</li>
<li>Bilet Przemyśl → Praga na pociągi EC i IC kup osobno u czeskiego przewoźnika České dráhy (ČD) — na cd.cz lub w aplikacji ČD My Train (Můj vlak).</li>
<li>Po zakupie zapisz oba e-bilety w telefonie. Przed podróżą sprawdź daty, godziny odjazdu i stacje docelowe.</li></ol>
<a class="btn pri" href="https://app.uz.gov.ua/start" target="_blank" rel="noopener">Kup w aplikacji UZ bilet Kijów → Przemyśl</a>
<a class="btn" href="https://www.cd.cz/spojeni-a-jizdenka/" target="_blank" rel="noopener">Kup bilet Przemyśl → Praga na stronie ČD</a></div>
<div><h3 data-tr="715К" data-dt="odjazd z Kijowa {t1}, przyjazd do Pragi {t2}">Z przesiadką w Przemyślu</h3><ol class="steps">
<li>Otwórz aplikację Ukrzaliznytsia, wybierz trasę Kijów → Przemyśl i datę podróży. Sprzedaż biletów rusza na 20 dni przed odjazdem o 08:00 czasu kijowskiego. Wybierz pociąg 715К i opłać bilet.</li>
<li>Bilet Przemyśl → Praga na pociąg RJ kup osobno u czeskiego przewoźnika RegioJet — na stronie regiojet.cz lub w aplikacji RegioJet.</li>
<li>Po zakupie zapisz oba e-bilety w telefonie. Przed podróżą sprawdź daty, godziny odjazdu i stacje docelowe.</li></ol>
<a class="btn pri" href="https://app.uz.gov.ua/start" target="_blank" rel="noopener">Kup w aplikacji UZ bilet Kijów → Przemyśl</a>
<a class="btn" href="https://regiojet.cz/" target="_blank" rel="noopener">Kup bilet Przemyśl → Praga na stronie RegioJet</a></div>
<div><h3 data-tr="059К" data-dt="odjazd z Kijowa {t1}, przyjazd do Pragi {t2}">Z przesiadką w Czopie</h3><ol class="steps">
<li>Otwórz aplikację Ukrzaliznytsia, wybierz trasę Kijów → Czop i datę podróży. Sprzedaż biletów rusza na 20 dni przed odjazdem o 08:00 czasu kijowskiego. Wybierz pociąg 059К i opłać bilet.</li>
<li>Bilet Czop → Praga na pociąg RJ kup osobno u czeskiego przewoźnika RegioJet — na stronie regiojet.cz lub w aplikacji RegioJet.</li>
<li>Po zakupie zapisz oba e-bilety w telefonie. Przed podróżą sprawdź daty, godziny odjazdu i stacje docelowe.</li></ol>
<a class="btn pri" href="https://app.uz.gov.ua/start" target="_blank" rel="noopener">Kup w aplikacji UZ bilet Kijów → Czop</a>
<a class="btn" href="https://regiojet.cz/" target="_blank" rel="noopener">Kup bilet Czop → Praga na stronie RegioJet</a></div>
</div>
<p class="buy-note">Rozkłady jazdy mogą się zmienić, aktualne informacje sprawdź w aplikacji UZ, w aplikacji ČD My Train i na stronie RegioJet.</p></section>`;
    const app = document.getElementById("app");
    const norm = s => String(s || "").trim().toLowerCase();
    fetch(U + "/rest/v1/options?order=sort", {headers: {apikey: K, Authorization: "Bearer " + K}}).then(r => {
        if (!r.ok) throw 0;
        return r.json()
    }).then(all => {
        const list = all.filter(o => o.active !== false).map(o => {
            const p = parseOption(o.dsl);
            return {o, p, h: p.head || deriveHead(p.legs)}
        }).filter(x => x.p.legs.length && norm(x.h.from).startsWith(norm(FROM)) && norm(x.h.to).startsWith(norm(TO)));
        const HAS_DIRECT = false; /* false: страница без прямого поезда, все варианты идут как «с пересадкой» */
        const direct = HAS_DIRECT ? list.filter(x => x.p.legs.length === 1) : [], transfer = HAS_DIRECT ? list.filter(x => x.p.legs.length > 1) : list;
        /* заголовки блоков покупки: времена берём из тех же вариантов, что в таблицах; вариант выбираем по номеру поезда УЗ */
        document.querySelectorAll("#more h3[data-tr]").forEach(h => {
            const x = list.find(x => x.p.legs.some(L => trainKey(L.train) === trainKey(h.dataset.tr)));
            if (x) h.insertAdjacentText("beforeend", " (" + h.dataset.dt.replace("{t1}", x.h.ft).replace("{t2}", x.h.tt) + ")")
        });
        if (!list.length) {
            app.innerHTML = `<div class="panel"><h2>Brak połączeń</h2><p>Dodaj je w panelu administratora.</p></div>`;
            return
        }
        app.innerHTML = ""
            + (() => {
            const block = (arr, h, b) => arr.length ? `<h2 class="sub${arr.length === 1 ? " c" : ""}">${h}</h2><div class="cols${arr.length === 1 ? " one" : ""}"${b ? ' data-b="1"' : ""} style="margin-top:16px">${arr.map(x => optHtml(x.o)).join("")}</div>` : "";
            if (!SPLIT.length) return block(transfer, "Z przesiadką");
            const at = x => { const s = x.p.legs[0].stops; return norm(s[s.length - 1].name) }; /* станция первой пересадки */
            const used = new Set();
            const parts = SPLIT.map(s => { const g = transfer.filter(x => at(x).startsWith(norm(s[0]))); g.forEach(x => used.add(x)); return block(g, esc(s[1]), s[2]) });
            return parts.join("") + block(transfer.filter(x => !used.has(x)), "Z przesiadką")
        })();
        
        /*B*/document.querySelectorAll((SPLIT.length ? ".cols[data-b] " : "") + ".swap").forEach(s => s.insertAdjacentHTML("afterend", `<div class="swap border">🛂 Po przyjeździe do Przemyśla odbywa się kontrola graniczna</div>`));/*/B*/
    }).catch(() => {
        app.innerHTML = `<div class="panel"><h2>Nie udało się załadować danych</h2><p>Odśwież stronę później.</p></div>`
    });
    const here = location.pathname.split("/").pop() || "index.html",
        others = ((window.CFG && CFG.PAGES) || []).filter(p => p.href !== here);
    document.getElementById("more").innerHTML = BUY + `<section class="panel"><h2>Inne trasy</h2><div class="grid" style="margin-top:12px"><a class="btn" href="./#${BACK}">← Czechy — Ukraina</a>${others.map(p => `<a class="btn" href="${esc(p.href)}">${esc(trRoute(p.title))}</a>`).join("")}<a class="btn" href="./">Wszystkie kraje</a></div></section>`;
</script>

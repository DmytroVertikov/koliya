        <p id="lead">Rozkład pociągów Wiedeń — Kijów: warianty z przesiadką w Czopie. Czas podróży, postoje i informacje o zakupie biletów.</p></div>

<script>
    const SPLIT = []; /* [станция пересадки, заголовок, пограничный контроль]: страница делится на группы по пересадке */
    const FROM = "Вена", TO = "Киев", BACK = "ua-at"; // FROM/TO: русские названия, как в шапке карточки в админке
    /*D*//*C*/const COACH = `<aside class="coach"><p>W przedziale są trzy miejsca do spania, jedno nad drugim. Gdy środkowa półka jest rozłożona do spania, nie wolno siedzieć na dolnej. Na górną półkę prowadzi drabinka.</p></aside>`;/*/C*//*/D*/
    const BUY = `<section class="panel"><h2>Jak kupić bilety</h2>
<div class="buy three">
<!--D--><div class="d"><h3>Pociąg bezpośredni</h3><ol class="steps">
<li>Otwórz aplikację Ukrzaliznytsia, wybierz trasę Wiedeń → Kijów i datę podróży. Sprzedaż biletów rusza na 20 dni przed odjazdem o 08:00 czasu kijowskiego. Bilety na pociąg bezpośredni cieszą się dużym popytem, dlatego warto kupić je zaraz po otwarciu sprzedaży.</li>
<li>Wybierz miejsce w wagonie z przedziałami standardu RIC i zapłać kartą. E-bilet pojawi się w aplikacji. Przy wsiadaniu okaż go razem z paszportem.</li></ol>
<a class="btn" href="https://app.uz.gov.ua/start" target="_blank" rel="noopener">Kup w aplikacji UZ bilet Wiedeń → Kijów</a></div><!--/D-->
<!--T--><div><h3>Z przesiadką w Czopie</h3><ol class="steps">
<li>Otwórz aplikację Ukrzaliznytsia, wybierz trasę Czop → Kijów i datę podróży. Sprzedaż biletów rusza na 20 dni przed odjazdem o 08:00 czasu kijowskiego. Wybierz pociąg 028Л i opłać bilet.</li>
<li>Kup bilet na pociąg Wiedeń → Czop w aplikacji Ukrzaliznytsia. Bilet można też kupić wcześniej u austriackiego przewoźnika ÖBB — na tickets.oebb.at lub w aplikacji ÖBB Tickets. W takim przypadku będzie jednak znacznie droższy niż w aplikacji Ukrzaliznytsia.</li>

<li>Po zakupie zapisz oba e-bilety w telefonie. Przed podróżą sprawdź daty, godziny odjazdu i stacje docelowe.</li></ol>
<a class="btn pri" href="https://app.uz.gov.ua/start" target="_blank" rel="noopener">Kup w aplikacji UZ bilet Czop → Kijów</a>
<a class="btn" href="https://tickets.oebb.at/" target="_blank" rel="noopener">Kup na stronie ÖBB bilet Wiedeń → Czop</a></div><!--/T-->
<!--H--><div><h3>Z przesiadką w Budapeszcie</h3><ol class="steps">
<li>Otwórz aplikację Ukrzaliznytsia, wybierz trasę Budapeszt → Kijów i datę podróży. Sprzedaż biletów rusza na 20 dni przed odjazdem o 08:00 czasu kijowskiego. Wybierz pociąg i opłać bilet.</li>
<li>Bilet Wiedeń → Budapeszt można kupić u węgierskiego przewoźnika MÁV — na jegy.mav.hu lub w aplikacji MÁVPlusz, albo u austriackiego przewoźnika ÖBB — na tickets.oebb.at lub w aplikacji ÖBB Tickets.</li>
<li>Po zakupie zapisz oba e-bilety w telefonie. Przed podróżą sprawdź daty, godziny odjazdu i stacje docelowe.</li></ol>
<a class="btn pri" href="https://app.uz.gov.ua/start" target="_blank" rel="noopener">Kup w aplikacji UZ bilet Budapeszt → Kijów</a>
<a class="btn" href="https://jegy.mav.hu/" target="_blank" rel="noopener">Kup na stronie MÁV bilet Wiedeń → Budapeszt</a>
<a class="btn" href="https://tickets.oebb.at/" target="_blank" rel="noopener">Kup na stronie ÖBB bilet Wiedeń → Budapeszt</a></div><!--/H-->


</div>
<p class="buy-note">Rozkłady jazdy mogą ulec zmianie. Aktualne informacje znajdziesz w aplikacji UZ i na stronie ÖBB.</p></section>`;
    const app = document.getElementById("app");
    const norm = s => String(s || "").trim().toLowerCase();
    fetch(U + "/rest/v1/options?order=sort", {headers: {apikey: K, Authorization: "Bearer " + K}}).then(r => {
        if (!r.ok) throw 0;
        return r.json()
    }).then(all => {
        const list = all.filter(o => o.active !== false).map(o => {
            const p = parseOption(o.dsl);
            return {o, p, h: p.head || deriveHead(p.legs)}
        }).filter(x => x.p.legs.length && norm(x.h.from).startsWith(norm(FROM)) && norm(x.h.to).startsWith(norm(TO)));
        const HAS_DIRECT = true; /* false: страница без прямого поезда, все варианты идут как «с пересадкой» */
        /* LEADX: если среди вариантов есть пересадка на этой станции, подзаголовок страницы берётся из LEADM (с этой станцией) */
        const LEADX = "", LEADM = "";
        if (LEADX && LEADM && list.some(x => x.p.legs.length > 1 && (s => norm(s[s.length - 1].name).startsWith(norm(LEADX)))(x.p.legs[0].stops))) document.getElementById("lead").textContent = LEADM;
        const direct = HAS_DIRECT ? list.filter(x => x.p.legs.length === 1) : [], transfer = HAS_DIRECT ? list.filter(x => x.p.legs.length > 1) : list;
        /* блоки покупки: вариант ищем по перевозчику чешского поезда (EC/IC = ČD, RJ = RegioJet) и станции пересадки;
           время и номер поезда УЗ берём из остановок варианта, а не из шапки, чтобы не зависеть от ручных правок */
        const tm = s => (String(s).match(/\d{1,2}:\d{2}/) || [""])[0], isUz = L => !/^[A-Za-z]/.test(String(L.train).trim());
        const carOf = L => /^(EC|IC)\b/i.test(L.train.trim()) ? "cd" : /^RJ\b/i.test(L.train.trim()) ? "rj" : "";
        const blocks = [];
        document.querySelectorAll("#more h3[data-car]").forEach(h => {
            const x = list.find(x => {
                const L = x.p.legs, cz = L.find(l => !isUz(l)), s = L[0].stops;
                return L.length > 1 && cz && carOf(cz) === h.dataset.car && norm(s[s.length - 1].name).startsWith(norm(h.dataset.x))
            });
            if (!x) { blocks.push({blk: h.parentNode, k: [9, 0]}); return }
            const L = x.p.legs, last = L[L.length - 1].stops, ft = tm(L[0].stops[0].time) || x.h.ft, tt = tm(last[last.length - 1].time) || x.h.tt, u = L.find(isUz);
            h.insertAdjacentText("beforeend", " (" + h.dataset.dt.replace("{t1}", ft).replace("{t2}", tt) + ")");
            if (u) h.parentNode.querySelectorAll(".utr").forEach(e => e.textContent = String(u.train).trim().replace(/^№\s*/, "").toUpperCase());
            const g = SPLIT.findIndex(s => norm(L[0].stops[L[0].stops.length - 1].name).startsWith(norm(s[0])));
            blocks.push({blk: h.parentNode, k: [g < 0 ? 8 : g, list.indexOf(x)]})
        });
        /* блоки покупки идут в том же порядке, что и варианты на странице: сначала группы по пересадке, внутри — как в базе */
        if (blocks.length) {
            const box = blocks[0].blk.parentNode;
            blocks.map((b, i) => Object.assign({i}, b)).sort((a, b) => a.k[0] - b.k[0] || a.k[1] - b.k[1] || a.i - b.i).forEach(b => box.appendChild(b.blk))
        }
        if (!list.length) {
            app.innerHTML = `<div class="panel"><h2>Brak połączeń</h2><p>Dodaj je w panelu administratora.</p></div>`;
            return
        }
        app.innerHTML = ""/*D*/ + (direct.length ? `<h2 class="sub" style="margin-top:6px">Pociąg bezpośredni <small>bez przesiadek</small></h2><div class="direct direct-wrap" style="margin-top:16px">${direct.map(x => optHtml(x.o)).join("")}</div>` : "")
            + (direct.length && transfer.length ? `<aside class="ad wide" data-slot="mid" hidden></aside>` : "")/*/D*/
            + (() => {
            const block = (arr, h, b) => arr.length ? `<h2 class="sub${arr.length === 1 ? " c" : ""}">${h}</h2><div class="cols${arr.length === 1 ? " one" : ""}"${b ? ' data-b="1"' : ""} style="margin-top:16px">${arr.map(x => optHtml(x.o)).join("")}</div>` : "";
            if (!SPLIT.length) return block(transfer, "Z przesiadką w Czopie");
            const at = x => { const s = x.p.legs[0].stops; return norm(s[s.length - 1].name) }; /* станция первой пересадки */
            const used = new Set();
            const parts = SPLIT.map(s => { const g = transfer.filter(x => !used.has(x) && at(x).startsWith(norm(s[0])) && (!s[3] || x.p.legs.length === s[3])); g.forEach(x => used.add(x)); return block(g, esc(s[1]), s[2]) });
            return parts.join("") + block(transfer.filter(x => !used.has(x)), "Z przesiadką w Czopie")
        })();
        /*D*//*C*/document.querySelectorAll(".direct .body").forEach(b => {
            b.classList.add("two");
            b.insertAdjacentHTML("beforeend", COACH)
        });/*/C*//*/D*/
        
    }).catch(() => {
        app.innerHTML = `<div class="panel"><h2>Nie udało się załadować danych</h2><p>Odśwież stronę później.</p></div>`
    });
    const here = location.pathname.split("/").pop() || "index.html",
        others = ((window.CFG && CFG.PAGES) || []).filter(p => p.href !== here);
    document.getElementById("more").innerHTML = BUY + `<section class="panel"><h2>Inne trasy</h2><div class="grid" style="margin-top:12px"><a class="btn" href="./#${BACK}">← Ukraina — Austria</a>${others.map(p => `<a class="btn" href="${esc(p.href)}">${esc(trRoute(p.title))}</a>`).join("")}<a class="btn" href="./">Wszystkie kraje</a></div></section>`;
</script>

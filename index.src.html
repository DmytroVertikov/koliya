<!DOCTYPE html>
<!-- build {{stamp}} -->
<html lang="{{lang}}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{ix.title}}</title>
    <meta name="description" content="{{ix.lead}}">
    <meta name="theme-color" content="#12145c">
    <link rel="canonical" href="{{canon}}">
{{alts}}
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Колія">
    <meta property="og:title" content="{{ix.title}}">
    <meta property="og:description" content="{{ix.lead}}">
    <meta property="og:url" content="{{canon}}">
    <meta property="og:locale" content="{{ogloc}}">
    <script type="application/ld+json">{{jsonld}}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="{{base}}style.css?v={{ver}}">
</head>
<body>
<header>
    <div class="wrap"><nav class="lang" aria-label="Language">{{langs}}</nav><a class="logo" href="#"><span class="rails" aria-hidden="true">🚆</span> КОЛІЯ</a>
        <h1 id="h1">{{ix.h1}}</h1>
        <p id="lead">{{ix.lead}}</p>
        <nav class="dirnav" id="dirnav" aria-label="{{ix.nav}}"><a href="#countries" data-dir="out">{{ix.fromUa}}</a><a href="#countries" data-dir="in">{{ix.toUa}}</a></nav></div>
</header>
<main class="wrap" id="app">
    <div id="home">
        <section class="panel" id="countries" aria-labelledby="h-countries">
            <h2 id="h-countries">{{ix.countries.h}}</h2>
            <ul class="cgrid">
{{countries}}
            </ul>
        </section>
        <section class="pop" aria-labelledby="h-pop">
            <h2 id="h-pop">{{ix.popular}}</h2>
            <div class="pgrid">
{{popular}}
            </div>
        </section>
        <section class="how" aria-labelledby="h-how">
            <h2 id="h-how">{{ix.how.h}}</h2>
            <ol class="steps"><li>{{ix.how1}}</li><li>{{ix.how2}}</li><li>{{ix.how3}}</li></ol>
        </section>
        <section class="info" aria-labelledby="h-info">
            <h2 id="h-info">{{ix.info.h}}</h2>
            <div class="igrid">
{{info}}
            </div>
        </section>
    </div>
    <div id="dir" hidden></div>
</main>
<footer class="wrap" id="site-footer">{{footer}}</footer>
<script>window.LANG = "{{lang}}";</script>
<script src="{{base}}config.js"></script>
<script src="{{base}}i18n.js"></script>
<script src="{{base}}common.js"></script>
<script>
    /* Главная целиком лежит в HTML (страны, маршруты, полезные ссылки). Скрипт нужен только для интерактива:
       фильтр «Из Украины / В Украину» и страницы направлений по #хэшу (#ua-pl, #pl-ua …), как и раньше. */
    const PG = (window.CFG && CFG.PAGES) || [];
    const DIR = {{dirjson}}; /* код направления → заголовок на текущем языке */
    const home = document.getElementById("home"), dir = document.getElementById("dir"), dnav = document.getElementById("dirnav"),
        h1El = document.getElementById("h1"), leadEl = document.getElementById("lead"),
        T0 = {h1: h1El.textContent, lead: leadEl.textContent, title: document.title};

    const pageLinks = id => {
        const list = PG.filter(p => p.route === id); /* только страницы этого направления: ua-pl → из Украины в Польшу, pl-ua → обратно */
        if (!list.length) return "";
        /* группы по городу отправления (первая часть «A → B»): каждый город — своя карточка, внутри — строки со ссылками на город прибытия */
        const groups = new Map();
        list.forEach(p => {
            const parts = trRoute(p.title).split(" → "), g = parts.length > 1 ? parts[0] : "", label = parts.length > 1 ? parts.slice(1).join(" → ") : parts[0];
            if (!groups.has(g)) groups.set(g, []);
            groups.get(g).push({p, label})
        });
        return `<div class="dgrid">${[...groups].map(([g, items]) => `<section class="dcard">${g ? `<h2 class="dg">${esc(g)}</h2>` : ""}<div class="chips">${items.map(({p, label}) => `<a class="chip" href="${esc(p.href)}" title="${esc(trRoute(p.title))}" aria-label="${esc(trRoute(p.title))}"><span class="lb">${esc(label)}</span><span class="ar" aria-hidden="true">→</span></a>`).join("")}</div></section>`).join("")}</div>`
    };

    /* верхняя панель страницы направления: «← Все направления» и переход в обратное направление (ua-pl ⇄ pl-ua) */
    const dirBar = id => {
        const rev = id.split("-").reverse().join("-");
        return `<div class="dirbar"><a class="back" href="#">${esc(t("ix.all"))}</a>${DIR[rev] && rev !== id ? `<a class="rev" href="#${esc(rev)}"><span aria-hidden="true">⇄</span> ${esc(DIR[rev])}</a>` : ""}</div>`
    };

    let cur = null;
    function render() {
        const id = location.hash.slice(1), r = DIR[id], want = r ? id : "";
        document.querySelectorAll(".lang a").forEach(a => a.href = a.href.split("#")[0] + location.hash);
        if (want === cur) return; /* прочие хэши (например #countries) ничего не меняют */
        const first = cur === null;
        cur = want;
        if (r) {
            home.hidden = true;
            dnav.hidden = true;
            dir.hidden = false;
            document.title = t("ix.dirTitle", {t: r});
            h1El.textContent = r;
            leadEl.textContent = t("ix.leadDir");
            dir.innerHTML = `${dirBar(id)}${pageLinks(id) || `<section class="panel" style="margin-top:0"><p>${esc(t("ix.soon"))}</p></section>`}`
        } else {
            home.hidden = false;
            dnav.hidden = false;
            dir.hidden = true;
            dir.innerHTML = "";
            document.title = T0.title;
            h1El.textContent = T0.h1;
            leadEl.textContent = T0.lead
        }
        if (!first) window.scrollTo(0, 0)
    }

    /* фильтр направлений в шапке: без скрипта это просто ссылки на блок со странами */
    const tabs = [...dnav.querySelectorAll("a")];
    tabs.forEach(a => {
        a.setAttribute("role", "button");
        a.setAttribute("aria-pressed", "false");
        const go = e => {
            e.preventDefault();
            const d = a.dataset.dir, on = home.dataset.dir !== d;
            if (on) home.dataset.dir = d; else delete home.dataset.dir;
            tabs.forEach(x => x.setAttribute("aria-pressed", String(on && x.dataset.dir === d)));
            if (on) document.getElementById("countries").scrollIntoView({behavior: "smooth", block: "start"})
        };
        a.addEventListener("click", go);
        a.addEventListener("keydown", e => {
            if (e.key === " ") go(e)
        })
    });

    addEventListener("hashchange", render);
    render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Колія: админка</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        label {
            display: block;
            font-size: 13px;
            color: var(--mute);
            margin: 10px 0 4px;
            font-weight: 600
        }

        input, textarea, select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--ink);
            font: inherit
        }

        input[type=checkbox] {
            width: 22px;
            height: 22px;
            padding: 0;
            accent-color: var(--brand)
        }

        textarea {
            min-height: 90px;
            font-family: ui-monospace, Menlo, monospace;
            font-size: 14px
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap
        }

        .row > * {
            flex: 1;
            min-width: 120px
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 10px 16px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            background: var(--soft);
            color: var(--brand)
        }

        button.pri {
            background: var(--acc);
            color: var(--accink)
        }

        button.del {
            background: #fde4e4;
            color: #a11
        }

        button.sm {
            padding: 6px 10px;
            font-size: 14px
        }

        .ok {
            color: #1a7f37;
            font-size: 13px
        }

        .err {
            color: #c62828;
            font-size: 13px
        }

        .bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap
        }

        #toast {
            position: fixed;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            background: var(--ink);
            color: var(--bg);
            padding: 10px 18px;
            border-radius: 99px;
            display: none;
            z-index: 9
        }

        /* редактор поездов */
        .eopt {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 16px;
            margin-top: 16px
        }

        .hdr {
            border: 1px dashed var(--brand);
            border-radius: 16px;
            padding: 12px 14px;
            margin-bottom: 6px
        }

        .hdr h3 {
            margin: 0;
            font-size: 16px
        }

        .lg {
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px;
            margin-top: 12px;
            background: var(--card)
        }

        .lg .bar input {
            flex: 1
        }

        .tw {
            overflow-x: auto
        }

        table.st {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0 8px;
            min-width: 540px
        }

        .st th {
            font-size: 12px;
            color: var(--mute);
            text-align: left;
            padding: 0 6px 4px;
            font-weight: 600
        }

        .st td {
            padding: 3px 4px;
            vertical-align: middle
        }

        .st td:nth-child(1) {
            width: 54px;
            text-align: center
        }

        .st td:nth-child(3) {
            width: 125px
        }

        .st td:nth-child(4) {
            width: 190px;
            white-space: nowrap
        }

        .st input.nm, .st input.tm, .lg .bar input.tr, .hdr input {
            font-family: var(--body);
            font-size: 19px;
            font-weight: 500;
            padding: 11px 12px
        }

        .lg .bar input.tr {
            font-weight: 600
        }

        .st input.tm, .hdr input {
            font-variant-numeric: tabular-nums
        }

        .st tr.hl input.nm, .st tr.hl input.tm {
            font-weight: 600;
            border-color: var(--brand)
        }

        .st tr:not(.hl) input.nm, .st tr:not(.hl) input.tm {
            color: var(--mute)
        }

        .xfer {
            text-align: center;
            margin: 12px 0 0;
            padding: 8px;
            border-radius: 12px;
            background: rgba(255, 210, 63, .24);
            font-weight: 600;
            font-size: 14px
        }

        .pv .opt {
            margin-top: 8px
        }

        .fqr {
            margin: 10px 0 0
        }

        .fqr input {
            font-size: 16px
        }

        .legend {
            font-size: 13px;
            color: var(--mute);
            margin: 6px 0 0
        }
    </style>
</head>
<body>
<header style="padding-bottom:44px">
    <div class="wrap bar"><b>⚙️ Колія: админка</b><span><a href="../" style="color:#fff">На сайт</a> <button id="out"
                                                                                                             style="display:none;margin-left:8px">Выйти</button></span>
    </div>
</header>
<main class="wrap" id="app"></main>
<div id="toast"></div>
<script src="../config.js"></script>
<script src="../dict/ru.js"></script>
<script src="../common.js"></script>
<script>
    const $ = s => document.querySelector(s);

    /* авто-двоеточие в полях времени (.tm, .hft, .htt): вводите только цифры, «1906» → «19:06».
       Слушатель в фазе перехвата срабатывает раньше обработчика редактора, поэтому в данные попадает уже готовое значение.
       Если в поле есть что-то кроме цифр и двоеточия (например «05:00 +1»), оно не трогается. */
    const fmtTime = (raw, del) => {
        let d = raw.replace(/\D/g, "");
        if (d[0] > "2") d = "0" + d;
        if (d[0] === "2" && d[1] > "3") d = "0" + d;
        if (d.length >= 3 && d[2] > "5") d = d.slice(0, 2) + "0" + d.slice(2);
        d = d.slice(0, 4);
        return d.length < 2 ? d : d.length === 2 ? (del ? d : d + ":") : d.slice(0, 2) + ":" + d.slice(2)
    };
    document.addEventListener("input", e => {
        const t = e.target;
        if (!t.matches || !t.matches("input.tm, input.hft, input.htt") || /[^\d:]/.test(t.value)) return;
        const v = fmtTime(t.value, /^delete/.test(e.inputType || ""));
        if (v !== t.value) {
            t.value = v;
            t.setSelectionRange(v.length, v.length)
        }
    }, true);
    let S = JSON.parse(localStorage.getItem("sb") || "null"), CT = [], RT = [];
    const toast = t => {
        const e = $("#toast");
        e.textContent = t;
        e.style.display = "block";
        setTimeout(() => e.style.display = "none", 2200)
    };
    const auth = async (q, b) => {
        const r = await fetch(U + "/auth/v1/token?grant_type=" + q, {
            method: "POST",
            headers: {apikey: K, "Content-Type": "application/json"},
            body: JSON.stringify(b)
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error_description || j.msg || "Ошибка входа");
        S = {a: j.access_token, r: j.refresh_token};
        localStorage.setItem("sb", JSON.stringify(S))
    };
    const logout = () => {
        S = null;
        localStorage.removeItem("sb");
        showLogin()
    };

    async function db(m, p, b, pref, retry = true) {
        const r = await fetch(U + "/rest/v1/" + p, {
            method: m,
            headers: {
                apikey: K,
                Authorization: "Bearer " + S.a,
                "Content-Type": "application/json",
                Prefer: pref || "return=representation"
            },
            body: b && JSON.stringify(b)
        });
        if (r.status == 401 && retry) {
            try {
                await auth("refresh_token", {refresh_token: S.r})
            } catch (e) {
                logout();
                throw e
            }
            return db(m, p, b, pref, false)
        }
        if (!r.ok) throw new Error(await r.text());
        return r.status == 204 ? null : r.json()
    }

    const newStop = () => ({name: "", time: "", hl: false});
    const newLeg = () => ({train: "", freq: "", stops: [{name: "", time: "", hl: true}, {name: "", time: "", hl: true}]});
    /* порядок на сайте — всегда по времени отправления; в базу пишем минуты от полуночи, чтобы колонка sort тоже была осмысленной */
    const tkey = o => {
        const m = String((o.head || {}).ft || "").match(/(\d{1,2}):(\d{2})/);
        return m ? +m[1] * 60 + +m[2] : 1e4
    };
    const fmtD = v => {
        const d = new Date(v), p = n => String(n).padStart(2, "0");
        return p(d.getDate()) + "." + p(d.getMonth() + 1) + "." + d.getFullYear()
    };
    const newHead = () => ({from: "", ft: "", to: "", tt: "", dur: "", tag: ""});

    /* ---------- вход ---------- */
    function showLogin() {
        $("#out").style.display = "none";
        $("#app").innerHTML = `<section class="panel" style="max-width:380px;margin:0 auto"><h2>Вход</h2><label>Email</label><input id="em" type="email" autocomplete="username"><label>Пароль</label><input id="pw" type="password" autocomplete="current-password"><p class="err" id="le"></p><button class="pri" id="go">Войти</button></section>`;
        $("#go").onclick = async () => {
            try {
                await auth("password", {email: $("#em").value, password: $("#pw").value});
                start()
            } catch (e) {
                $("#le").textContent = e.message
            }
        }
    }

    async function start() {
        $("#out").style.display = "";
        $("#out").onclick = logout;
        try {
            [CT, RT] = await Promise.all([db("GET", "countries?order=sort"), db("GET", "routes?order=sort")]);
            CFG.PAGES = CFG.pagesFromRows(await db("GET", "route_pages?order=sort,id"))
        } catch (e) {
            return showLogin()
        }
        home()
    }

    /* Страницы маршрутов берутся из базы (route_pages → CFG.PAGES); варианты на странице = те, у кого шапка «откуда → куда» совпадает с названием страницы */
    const PAGES = () => (window.CFG && CFG.PAGES) || [];
    const ends = p => String(p.title).split("→").map(x => x.trim());
    const norm = s => String(s || "").trim().toLowerCase();
    const parseO = o => {
        const p = parseOption(o.dsl);
        o.legs = p.legs.length ? p.legs : [newLeg()];
        o.head = p.head || deriveHead(o.legs);
        return o
    };
    const onPage = (o, pg) => {
        const [a, b] = ends(pg);
        return norm(o.head.from).startsWith(norm(a)) && norm(o.head.to).startsWith(norm(b))
    };

    /* список страниц: группы по направлению (ua-pl, pl-ua …), внутри — порядок из вкладки «Направления»: город, затем Варшава, Краков, Хелм, Перемышль.
       Страницы с slice: true (Хелм, Перемышль) не имеют своих вариантов: поезда берутся из вариантов других страниц */
    const pageOpts = cur => {
        const g = new Map();
        PAGES().forEach(p => {
            if (!g.has(p.route)) g.set(p.route, []);
            g.get(p.route).push(p)
        });
        return [...g].map(([rt, list]) => `<optgroup label="${esc((RT.find(r => r.slug === rt) || {}).title || rt)}">${list.map(p => `<option value="${esc(p.href)}" ${p.href === cur ? "selected" : ""}>${esc(p.title)}${p.slice ? " · из других вариантов" : ""} (${esc(p.href)})</option>`).join("")}</optgroup>`).join("")
    };
    /* та же логика, что в route.src.html (SLICE): участок поезда «откуда → куда» по его остановкам; повторы (тот же поезд и время) убираются */
    const sliceOpts = (all, pg) => {
        const [FROM, TO] = ends(pg), hm = s => (String(s).match(/\d{1,2}:\d{2}/) || [""])[0], seen = new Set(), out = [];
        all.filter(o => o.active !== false).forEach(src => src.legs.forEach(L => {
            const st = L.stops, a = st.findIndex(s => norm(s.name).startsWith(norm(FROM)));
            if (a < 0) return;
            const b = st.findIndex((s, i) => i > a && norm(s.name).startsWith(norm(TO)));
            if (b < 0) return;
            const key = norm(L.train) + "|" + hm(st[a].time) + ">" + hm(st[b].time);
            if (seen.has(key)) return;
            seen.add(key);
            const part = st.slice(a, b + 1), fq = L.freq && !/^ежедневно$/i.test(L.freq.trim()) ? " ~ " + L.freq.trim() : "",
                dsl = L.train.trim() + fq + ": " + part.map((s, i) => (i === 0 || i === part.length - 1 ? "*" : "") + (s.name + " " + s.time).trim()).join(" > "),
                p = parseOption(dsl), o = {dsl, updated_at: src.updated_at, active: true, src};
            o.legs = p.legs;
            o.head = deriveHead(p.legs);
            out.push(o)
        }));
        return out.sort((x, y) => tkey(x) - tkey(y)) /* всегда по времени отправления, как на сайте */
    };
    function editSlice(pg, all) {
        const ed = $("#ed"), pages = PAGES(), list = sliceOpts(all, pg), ck = list.map(o => Date.parse(o.updated_at)).filter(Boolean);
        ed.innerHTML = `<section class="panel"><div class="bar"><h2 style="margin:0">${esc(pg.title)}</h2></div>
<p class="legend">Страница: <a href="../${esc(pg.href)}" target="_blank" rel="noopener">${esc(pg.href)}</a>. Своих вариантов у неё нет: сайт сам вырезает участок «${esc(ends(pg).join(" → "))}» из поездов вариантов других страниц (по остановкам поезда), порядок — по времени отправления. Чтобы изменить время или добавить поезд, правьте исходный вариант (кнопка «Открыть исходный вариант»).</p>
<p class="legend">${ck.length ? "Дата «Проверено» на сайте: " + fmtD(Math.max(...ck)) + " (самое свежее сохранение среди исходных вариантов)." : ""}</p></section>
${list.map((o, i) => {
            const sp = pages.find(p => !p.slice && onPage(o.src, p));
            return `<section class="panel eopt"><div class="bar"><b>${esc(o.head.ft)} → ${esc(o.head.tt)}</b><span class="legend">из варианта «${esc(o.src.head.from)} → ${esc(o.src.head.to)}»${sp ? ` <button class="sm go" data-i="${i}" data-h="${esc(sp.href)}">Открыть исходный вариант</button>` : ""}</span></div>${optHtml({dsl: o.dsl, note: ""})}</section>`
        }).join("") || '<section class="panel"><p>Подходящих поездов в базе пока нет: ни у одного варианта нет поезда, который проходит обе станции.</p></section>'}`;
        ed.querySelectorAll("button.go").forEach(b => b.onclick = () => {
            $("#sel").value = b.dataset.h;
            editPage(pages.find(p => p.href === b.dataset.h));
            $("#ed").scrollIntoView({behavior: "smooth"})
        })
    }

    function home(cur) {
        const app = $("#app");
        app.innerHTML = `<section class="panel" style="margin-top:0"><h2 style="margin:0">Страницы маршрутов</h2>
<label>Выберите страницу</label><select id="sel"><option value="">—</option>${pageOpts(cur)}<option value="__orph" ${cur === "__orph" ? "selected" : ""}>⚠ Варианты без страницы (проверка)</option></select>
<p class="legend">Новая страница маршрута создаётся во вкладке «Направления» админки поездов и сразу появляется в этом списке.</p></section>
<section class="panel"><details><summary><b>Страны и направления для главной</b></summary><div id="cs"></div><div id="rts"></div></details></section><div id="ed"></div>`;
        $("#sel").onchange = e => {
            const v = e.target.value;
            if (!v) $("#ed").innerHTML = "";
            else editPage(v === "__orph" ? {orph: true, title: "Варианты без страницы", route: ""} : PAGES().find(p => p.href === v))
        };
        countries();
        routes();
        if (cur) $("#sel").onchange({target: $("#sel")})
    }

    function routes() {
        $("#rts").innerHTML = `<div class="bar" style="margin-top:18px"><b>Направления (кнопки «Из Украины →» на главной)</b><button id="nr">+ Новое направление</button></div>
<select id="sel2"><option value="">—</option>${RT.map(r => `<option value="${esc(r.slug)}">${esc(r.title)} (${esc(r.slug)})</option>`).join("")}</select><div id="rm"></div>`;
        $("#sel2").onchange = e => e.target.value ? routeForm(RT.find(r => r.slug === e.target.value)) : ($("#rm").innerHTML = "");
        $("#nr").onclick = () => routeForm({slug: "", country: CT[0]?.slug, title: "", sort: (RT.length + 1) * 10}, true)
    }

    function routeForm(r, isNew) {
        $("#rm").innerHTML = `<div class="row"><div><label>Код (например ua-pl)</label><input id="rs" value="${esc(r.slug)}" ${isNew ? "" : "readonly"}></div><div><label>Страна</label><select id="rc">${CT.map(c => `<option value="${esc(c.slug)}" ${c.slug === r.country ? "selected" : ""}>${esc(c.flag)} ${esc(c.name)}</option>`).join("")}</select></div><div><label>Порядок</label><input id="ro" type="number" value="${r.sort}"></div></div>
<label>Заголовок</label><input id="rt" value="${esc(r.title)}">
<div class="row" style="margin-top:12px"><button class="pri" id="sr">Сохранить направление</button>${isNew ? "" : '<button class="del" id="dr">Удалить направление</button>'}</div>`;
        $("#sr").onclick = async () => {
            const slug = $("#rs").value.trim();
            try {
                if (!/^[a-z-]+$/.test(slug)) throw new Error("Код: только латиница и дефис");
                if (!$("#rt").value.trim()) throw new Error("Нужен заголовок");
                /* lead/how/tickets на сайте больше не используются; существующие значения не затираем */
                await db("POST", "routes?on_conflict=slug", {
                    slug, country: $("#rc").value, title: $("#rt").value.trim(),
                    lead: r.lead || "", how: r.how || "", tickets: r.tickets || "", sort: +$("#ro").value || 0
                }, "resolution=merge-duplicates,return=representation");
                RT = await db("GET", "routes?order=sort");
                toast("Сохранено");
                routes()
            } catch (e) {
                alert(e.message)
            }
        };
        if (!isNew) $("#dr").onclick = async () => {
            if (!confirm("Удалить направление и все его варианты?")) return;
            try {
                await db("DELETE", "routes?slug=eq." + encodeURIComponent(r.slug));
                RT = await db("GET", "routes?order=sort");
                routes();
                $("#rm").innerHTML = ""
            } catch (e) {
                alert(e.message)
            }
        }
    }



    function countries() {
        $("#cs").innerHTML = CT.concat([{
            slug: "",
            name: "",
            flag: "",
            sort: (CT.length + 1) * 10,
            n: 1
        }]).map((c, i) => `<div class="row" style="margin-top:10px" data-i="${i}"><input class="s" placeholder="код (pl)" value="${esc(c.slug)}" ${c.slug ? "readonly" : ""}><input class="f" placeholder="🇵🇱" value="${esc(c.flag)}"><input class="n" placeholder="Название" value="${esc(c.name)}"><input class="o" type="number" value="${c.sort}"><button class="pri sv">${c.n ? "Добавить" : "Сохранить"}</button>${c.n ? "" : '<button class="del dl">Удалить</button>'}</div>`).join("");
        document.querySelectorAll("#cs .row").forEach(w => {
            const g = c => w.querySelector(c).value.trim();
            w.querySelector(".sv").onclick = async () => {
                try {
                    if (!g(".s") || !g(".n")) throw new Error("Заполните код и название");
                    await db("POST", "countries?on_conflict=slug", {
                        slug: g(".s"),
                        name: g(".n"),
                        flag: g(".f"),
                        sort: +g(".o") || 0
                    }, "resolution=merge-duplicates,return=representation");
                    CT = await db("GET", "countries?order=sort");
                    toast("Сохранено");
                    countries()
                } catch (e) {
                    alert(e.message)
                }
            };
            const d = w.querySelector(".dl");
            if (d) d.onclick = async () => {
                if (!confirm("Удалить страну и все её маршруты?")) return;
                try {
                    await db("DELETE", "countries?slug=eq." + encodeURIComponent(g(".s")));
                    await start()
                } catch (e) {
                    alert(e.message)
                }
            }
        })
    }

    /* ---------- варианты на странице маршрута ---------- */
    async function editPage(pg) {
        const ed = $("#ed"), isNew = false, r = {slug: pg.route};
        const all = (await db("GET", "options?order=sort")).map(parseO), pages = PAGES();
        if (pg.slice) return editSlice(pg, all);
        const opts = pg.orph ? all.filter(o => !pages.some(p => onPage(o, p))) : all.filter(o => onPage(o, pg));
        const [fa, fb] = pg.orph ? ["", ""] : ends(pg);
        ed.innerHTML = `<section class="panel"><div class="bar"><h2 style="margin:0">${esc(pg.title)}</h2>${pg.orph ? "" : '<span><button id="cf" class="sm" title="Обновляет дату «Проверено» на странице, не меняя вариантов">✓ Подтвердить актуальность</button> <button id="no">+ Добавить вариант</button></span>'}</div>
<p class="legend">${pg.orph ? "Варианты, шапка которых не совпадает ни с одной страницей из списка направлений: на сайте они нигде не показываются. Поправьте шапку или удалите вариант." : `Страница: <a href="../${esc(pg.href)}" target="_blank" rel="noopener">${esc(pg.href)}</a>. Сюда попадают варианты, у которых шапка «${esc(fa)} → ${esc(fb)}». Новые варианты сохраняются с направлением ${esc(pg.route)}.`}</p>
${pg.orph ? "" : '<p class="legend" id="lu"></p>'}
<p>Вариант состоит из <b>шапки</b> (крупно сверху: откуда и куда, вы задаёте её сами) и <b>поездов</b> с таблицами станций. Галочка <b>«Выд.»</b> = станция выделяется крупным шрифтом, остальные показываются мельче и бледнее. Пересадка между поездами добавляется автоматически. Периодичность у каждого поезда по умолчанию «ежедневно»; если поезд ходит иначе, впишите в поле, например «по нечётным дням», «по чётным дням» или «пн, ср, пт». Варианты на сайте всегда идут по времени отправления. Название станции пишите по-русски: на других языках сайт переведёт его по словарю.</p><div id="ol"></div></section>`;
        const lastUpd = () => {
            const v = opts.filter(o => o.id && o.active && o.updated_at).map(o => Date.parse(o.updated_at));
            if (!pg.orph) $("#lu").textContent = v.length ? "Дата «Проверено» на сайте: " + fmtD(Math.max(...v)) + " (самое свежее сохранение среди показанных вариантов)." : "Показанных вариантов пока нет."
        };
        if (!pg.orph) $("#cf").onclick = async () => {
            const ids = opts.filter(o => o.id && o.active).map(o => o.id);
            if (!ids.length) return;
            try {
                const now = new Date().toISOString();
                await db("PATCH", "options?id=in.(" + ids.join(",") + ")", {updated_at: now}, "return=minimal");
                opts.forEach(o => {
                    if (o.id && o.active) o.updated_at = now
                });
                lastUpd();
                toast("Дата проверки обновлена")
            } catch (e) {
                alert(e.message)
            }
        };
        if (!pg.orph) $("#no").onclick = () => {
            opts.push({
                id: null, route_slug: pg.route, dsl: "", legs: [newLeg()], head: Object.assign(newHead(), {from: fa, to: fb}),
                note: "", sort: (opts.length + 1) * 10, active: true
            });
            list()
        };

        function legHtml(L, li) {
            return `${li ? '<div class="xfer">🔁 Пересадка</div>' : ""}<div class="lg" data-l="${li}">
<div class="bar"><input class="tr" placeholder="Номер поезда: 019 или IC 12010" value="${esc(L.train)}">${li ? '<button class="del sm rl">Убрать поезд</button>' : ""}</div>
<div class="fqr"><label>Периодичность (необязательно)</label><input class="fq" placeholder="Ежедневно" value="${esc(L.freq || "")}"></div>
<div class="tw"><table class="st"><thead><tr><th>Выд.</th><th>Станция</th><th>Время</th><th></th></tr></thead><tbody>
${L.stops.map((s, si) => `<tr data-s="${si}" class="${s.hl ? "hl" : ""}"><td><input type="checkbox" class="hl" ${s.hl ? "checked" : ""}></td><td><input class="nm" placeholder="Город" value="${esc(s.name)}"></td><td><input class="tm" placeholder="19:06" inputmode="numeric" value="${esc(s.time)}"></td><td><button class="sm up" title="Выше">↑</button> <button class="sm dn" title="Ниже">↓</button> <button class="sm ins" title="Добавить станцию ниже">＋</button> <button class="sm del rs" title="Удалить">×</button></td></tr>`).join("")}
</tbody></table></div><button class="sm as">+ Станция в конец</button></div>`
        }

        function list() {
            const box = $("#ol");
            if (isNew) return;
            opts.sort((a, b) => tkey(a) - tkey(b));
            if (!pg.orph) lastUpd();
            box.innerHTML = opts.map((o, i) => {
                const h = o.head;
                return `<div class="eopt" data-i="${i}">
<div class="hdr"><h3>Шапка карточки</h3><p class="legend">Крупно сверху на сайте. Задаётся вручную, от таблиц ниже не зависит.</p>
<div class="row"><div><label>Откуда</label><input class="hf" placeholder="Киев" value="${esc(h.from)}"></div><div><label>Отправление</label><input class="hft" placeholder="19:29" inputmode="numeric" value="${esc(h.ft)}"></div></div>
<div class="row"><div><label>Куда</label><input class="ht" placeholder="Варшава" value="${esc(h.to)}"></div><div><label>Прибытие</label><input class="htt" placeholder="10:24" inputmode="numeric" value="${esc(h.tt)}"></div></div>
<div class="row"><div><label>В пути (необязательно)</label><input class="hdur" value="${esc(h.dur)}"></div><div><label>Плашка (необязательно)</label><input class="htag" value="${esc(h.tag)}"></div></div>
<div style="margin-top:10px"><button class="sm fill">↧ Заполнить из таблиц (первая и последняя станция)</button></div></div>
<div class="legs">${o.legs.map(legHtml).join("")}</div>
<div style="margin-top:12px"><button class="al">+ Ещё поезд (пересадка)</button> <button class="sm tx">Текстом</button></div>
<div class="txw" style="display:none"><label>Текстовый формат (для опытных)</label><textarea class="dsl" style="min-height:140px"></textarea><button class="sm ap" style="margin-top:6px">Применить текст</button></div>
<h3 style="margin:18px 0 0;font-size:15px">Как это увидят на сайте</h3><div class="pv"></div>
<div class="row"><div><label>Примечание</label><input class="n" value="${esc(o.note)}"></div><div><label>Показывать</label><select class="a"><option value="1" ${o.active ? "selected" : ""}>Да</option><option value="0" ${o.active ? "" : "selected"}>Скрыт</option></select></div></div>
<div class="row" style="margin-top:12px"><button class="pri sv">Сохранить вариант</button>${o.id ? '<button class="del dl">Удалить</button>' : ""}${o.id && !pg.orph ? '<button class="sm cp">📋 Копировать на другую страницу</button>' : ""}</div>${o.id && !pg.orph ? `<div class="cpw" style="display:none;margin-top:10px"><label>Куда скопировать (копия создаётся скрытой)</label><div class="row"><select class="cps">${PAGES().filter(p => p.href !== pg.href).map(p => `<option value="${esc(p.href)}">${esc(p.title)}</option>`).join("")}</select><button class="sm cpg">Создать копию</button></div></div>` : ""}</div>`
            }).join("") || (isNew ? "" : "<p>Вариантов пока нет.</p>");
            box.querySelectorAll(".eopt").forEach(wire)
        }

        function wire(w) {
            const o = opts[+w.dataset.i], pv = w.querySelector(".pv"), q = c => w.querySelector(c);
            const upd = () => {
                const er = validateOption(o);
                let card = "";
                try {
                    card = optHtml({dsl: serializeOption(o), note: o.note})
                } catch (_) {
                }
                pv.innerHTML = (er.length ? `<div class="err" style="margin:8px 0">${er.map(esc).join("<br>")}</div>` : '<p class="ok" style="margin:8px 0">✓ Всё в порядке</p>') + card;
                q(".hdur").placeholder = "авто: " + (legsDur(o.legs, o.head) || autoDur(o.head.ft, o.head.tt) || "—");
                q(".htag").placeholder = "авто: " + autoTag(o.legs.length - 1)
            };
            const redraw = () => {
                q(".legs").innerHTML = o.legs.map(legHtml).join("");
                upd()
            };
            const pos = t => {
                const L = t.closest("[data-l]"), S = t.closest("[data-s]");
                return [L && +L.dataset.l, S && +S.dataset.s]
            };
            const HF = {hf: "from", hft: "ft", ht: "to", htt: "tt", hdur: "dur", htag: "tag"};
            w.addEventListener("input", e => {
                const t = e.target, [l, s] = pos(t), c = [...t.classList];
                const hk = c.find(x => HF[x]);
                if (hk) o.head[HF[hk]] = t.value;
                else if (t.classList.contains("tr")) o.legs[l].train = t.value;
                else if (t.classList.contains("nm")) o.legs[l].stops[s].name = t.value;
                else if (t.classList.contains("tm")) o.legs[l].stops[s].time = t.value;
                else if (t.classList.contains("fq")) o.legs[l].freq = t.value;
                else if (t.classList.contains("hl")) {
                    o.legs[l].stops[s].hl = t.checked;
                    t.closest("tr").classList.toggle("hl", t.checked)
                } else if (t.classList.contains("n")) o.note = t.value;
                else if (t.classList.contains("a")) o.active = t.value === "1";
                else return;
                upd()
            });
            w.addEventListener("click", e => {
                const t = e.target.closest("button");
                if (!t) return;
                const [l, s] = pos(t);
                if (t.classList.contains("as")) {
                    o.legs[l].stops.push(newStop());
                    redraw()
                } else if (t.classList.contains("ins")) {
                    o.legs[l].stops.splice(s + 1, 0, newStop());
                    redraw()
                } else if (t.classList.contains("rs")) {
                    o.legs[l].stops.splice(s, 1);
                    if (!o.legs[l].stops.length) o.legs[l].stops.push(newStop());
                    redraw()
                } else if (t.classList.contains("up") && s > 0) {
                    const a = o.legs[l].stops;
                    [a[s - 1], a[s]] = [a[s], a[s - 1]];
                    redraw()
                } else if (t.classList.contains("dn") && s < o.legs[l].stops.length - 1) {
                    const a = o.legs[l].stops;
                    [a[s + 1], a[s]] = [a[s], a[s + 1]];
                    redraw()
                } else if (t.classList.contains("rl")) {
                    o.legs.splice(l, 1);
                    redraw()
                } else if (t.classList.contains("al")) {
                    o.legs.push(newLeg());
                    redraw()
                } else if (t.classList.contains("fill")) {
                    const d = deriveHead(o.legs);
                    Object.assign(o.head, {from: d.from, ft: d.ft, to: d.to, tt: d.tt});
                    q(".hf").value = o.head.from;
                    q(".hft").value = o.head.ft;
                    q(".ht").value = o.head.to;
                    q(".htt").value = o.head.tt;
                    upd()
                } else if (t.classList.contains("tx")) {
                    const x = q(".txw");
                    x.style.display = x.style.display == "none" ? "" : "none";
                    q(".dsl").value = serializeOption(o).replace(/\|\|/g, "\n||\n")
                } else if (t.classList.contains("ap")) {
                    const p = parseOption(q(".dsl").value);
                    if (!p.legs.length) {
                        alert("Пустой текст");
                        return
                    }
                    o.legs = p.legs;
                    o.head = p.head || deriveHead(p.legs);
                    list()
                } else if (t.classList.contains("cp")) {
                    const x = q(".cpw");
                    x.style.display = x.style.display == "none" ? "" : "none"
                } else if (t.classList.contains("cpg")) copyTo();
                else if (t.classList.contains("sv")) save();
                else if (t.classList.contains("dl")) del()
            });

            async function save() {
                const er = validateOption(o);
                if (er.length) {
                    alert(er.join("\n"));
                    return
                }
                const b = {
                    route_slug: o.route_slug || r.slug,
                    dsl: serializeOption(o),
                    note: o.note.trim(),
                    sort: tkey(o),
                    active: o.active,
                    updated_at: new Date().toISOString()
                };
                try {
                    const x = o.id ? await db("PATCH", "options?id=eq." + o.id, b) : await db("POST", "options", b);
                    const legs = o.legs, head = o.head;
                    Object.assign(o, x[0]);
                    o.legs = legs;
                    o.head = head;
                    toast(!pg.orph && !onPage(o, pg) ? "Сохранено, но шапка не совпадает со страницей: на ней вариант не появится" : "Сохранено");
                    list()
                } catch (e) {
                    alert(e.message)
                }
            }

            /* копия варианта на другую страницу: названия начальной и конечной станций заменяются на названия той страницы
               («Одесса» → «Кременчуг»), «в пути» сбрасывается; копия создаётся скрытой, чтобы не показывать недоделанное.
               Дальше откройте страницу, поправьте номер поезда, станцию и время и включите «Показывать». */
            async function copyTo() {
                const tp = PAGES().find(p => p.href === q(".cps").value);
                if (!tp) return;
                const [sa, sb] = ends(pg), [ta, tb] = ends(tp);
                const ren = n => {
                    const v = String(n || "").trim(), x = norm(v);
                    if (sa && x.startsWith(norm(sa))) return ta + v.slice(sa.length);
                    if (sb && x.startsWith(norm(sb))) return tb + v.slice(sb.length);
                    return v
                };
                const c = JSON.parse(JSON.stringify({head: o.head, legs: o.legs}));
                c.head.from = ren(c.head.from);
                c.head.to = ren(c.head.to);
                c.head.dur = "";
                c.legs.forEach(L => L.stops.forEach(s => s.name = ren(s.name)));
                try {
                    await db("POST", "options", {
                        route_slug: tp.route, dsl: serializeOption(c), note: (o.note || "").trim(),
                        sort: tkey(c), active: false, updated_at: new Date().toISOString()
                    });
                    toast("Копия создана и скрыта: откройте «" + tp.title + "», поправьте и включите показ");
                    home(tp.href)
                } catch (e) {
                    alert(e.message)
                }
            }

            async function del() {
                if (!confirm("Удалить вариант?")) return;
                try {
                    await db("DELETE", "options?id=eq." + o.id);
                    opts.splice(+w.dataset.i, 1);
                    list()
                } catch (e) {
                    alert(e.message)
                }
            }

            upd()
        }

        list();
        ed.scrollIntoView({behavior: "smooth"})
    }

    S ? start() : showLogin();
</script>
</body>
</html>

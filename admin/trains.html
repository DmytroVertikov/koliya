        .xfer { margin: -2px 0; padding: 4px 10px; font-size: 13px; color: #344054; background: #eff4ff; border-radius: 8px; text-align: center }
        .xfer.warn { background: #fffaeb; color: #b54708 }

        .chips label { display: inline-flex; align-items: center; gap: 3px; border: 1px solid #d0d5dd; border-radius: 14px; padding: 2px 8px; font-size: 12px; background: #fff; cursor: pointer }
        .chips label.fix { background: #dbe6ff; border-color: #84adff }
        .conn { display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-bottom: 1px solid #eef0f3; font-size: 14px }
        .conn .t { flex: 1; min-width: 0 }
        .conn.off { opacity: .55 }
        .conn small { color: #667085; display: block }
        #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #101828; color: #fff; padding: 8px 16px; border-radius: 8px; display: none; z-index: 9 }
        .pvw { border: 1px dashed #98a2b3; border-radius: 10px; padding: 8px; margin: 10px 0; background: #fff }
    </style>
</head>

<script>
(function () { /* своя область видимости: имена hm, LG и др. уже заняты в common.js */
/* ================= чистая логика (без DOM) ================= */
/*PURE*/
const hm = t => t ? String(t).slice(0, 5) : "";
const toM = s => { const m = String(s || "").match(/^(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null };
const fmtM = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const durTxt = m => m == null ? "" : (m >= 60 ? Math.floor(m / 60) + " ч " : "") + (m % 60 ? m % 60 + " мин" : (m >= 60 ? "" : "0 мин"));

/* Сутки считаются сами: если время «прыгнуло назад» относительно предыдущего, значит прошла полночь */
function calcDays(rows) {
    let prev = null, day = 0;
    return rows.map(r => {
        const a = toM(r.arr), d = toM(r.dep), o = {ad: 0, dd: 0, aAbs: null, dAbs: null};
        if (a != null) { if (prev != null && a < prev % 1440) day++; o.ad = day; o.aAbs = day * 1440 + a; prev = o.aAbs }
        if (d != null) { if (prev != null && d < prev % 1440) day++; o.dd = day; o.dAbs = day * 1440 + d; prev = o.dAbs }
        return o
    })
}
/* те же правила, что check_train_stops в базе */
function validateStops(rows, stationOk) {
    const err = [], n = rows.length;
    if (n < 2) return ["Нужно минимум 2 станции"];
    const dd = calcDays(rows);
    let prev = null;
    rows.forEach((r, i) => {
        const w = (i + 1) + ". " + (r.name || "без станции") + ": ";
        if (!stationOk(r)) err.push(w + "такой станции нет в справочнике");
        const first = i === 0, last = i === n - 1;
        if (first && toM(r.dep) == null) err.push(w + "укажите время отправления");
        if (last && toM(r.arr) == null) err.push(w + "укажите время прибытия");
        if (!first && !last && (toM(r.arr) == null || toM(r.dep) == null)) err.push(w + "нужны и прибытие, и отправление");
        const a = dd[i].aAbs, d = dd[i].dAbs;
        if (a != null && d != null && d < a) err.push(w + "отправление раньше прибытия");
        prev = d != null ? d : a != null ? a : prev
    });
    return err
}

/* текстовый формат варианта — то же, что делает представление options_v2 */
function legStops(L, stops) { /* stops — все остановки поезда по порядку */
    const b = stops.find(s => s.id === L.board_stop_id), a = stops.find(s => s.id === L.alight_stop_id);
    const f = stops.find(s => s.id === L.show_from_stop_id), e = stops.find(s => s.id === L.show_to_stop_id);
    const lo = Math.min(f ? f.seq : b.seq, b.seq), hi = Math.max(e ? e.seq : a.seq, a.seq), hid = L.hidden_stop_ids || [];
    return stops.filter(s => s.seq >= lo && s.seq <= hi && (s.id === b.id || s.id === a.id || !hid.includes(s.id)))
}
function dslOf(C, legs, ctx) { /* ctx: {train(id), stops(train_id), station(id)} */
    const parts = legs.map(L => {
        const tr = ctx.train(L.train_id), stops = ctx.stops(L.train_id);
        const txt = legStops(L, stops).map(s => {
            const t = s.id === L.board_stop_id ? hm(s.dep_time) : s.id === L.alight_stop_id ? hm(s.arr_time)
                : s.arr_time && s.dep_time && hm(s.arr_time) !== hm(s.dep_time) ? hm(s.arr_time) + " – " + hm(s.dep_time) : hm(s.arr_time || s.dep_time);
            return (s.id === L.board_stop_id || s.id === L.alight_stop_id ? "*" : "") + ctx.station(s.station_id).name_ru + " " + t
        }).join(" > ");
        return tr.number + (tr.freq ? " ~ " + tr.freq : "") + ": " + txt
    });
    const f = legs[0], l = legs[legs.length - 1], fs = ctx.stops(f.train_id), ls = ctx.stops(l.train_id);
    const bs = fs.find(s => s.id === f.board_stop_id), as = ls.find(s => s.id === l.alight_stop_id);
    const nz = v => (v == null ? "" : String(v)).trim();
    let head = "@ " + (nz(C.head_from) || ctx.station(bs.station_id).name_ru) + " " + hm(C.head_dep_time || bs.dep_time)
        + " > " + (nz(C.head_to) || ctx.station(as.station_id).name_ru) + " " + hm(C.head_arr_time || as.arr_time);
    if (nz(C.head_dur) || nz(C.head_tag)) head += " ; " + nz(C.head_dur) + (nz(C.head_tag) ? " ; " + nz(C.head_tag) : "");
    return head + "||" + parts.join("||")
}
/* реальная длительность участка в минутах с учётом часовых поясов станций (tz_hours) */
function legMinutes(L, ctx) {
    const st = ctx.stops(L.train_id), rows = st.map(s => ({arr: hm(s.arr_time), dep: hm(s.dep_time)})), dd = calcDays(rows);
    const bi = st.findIndex(s => s.id === L.board_stop_id), ai = st.findIndex(s => s.id === L.alight_stop_id);
    if (bi < 0 || ai < 0 || dd[bi].dAbs == null || dd[ai].aAbs == null) return null;
    const tzB = ctx.station(st[bi].station_id).tz_hours, tzA = ctx.station(st[ai].station_id).tz_hours;
    return (dd[ai].aAbs - tzA * 60) - (dd[bi].dAbs - tzB * 60)
}
/* ожидание на пересадке: прибытие поезда 1 → отправление поезда 2 (в минутах, 0..1439; без дат считаем ближайшую «следующую» отправку) */
function waitMinutes(L1, L2, ctx) {
    const a = ctx.stops(L1.train_id).find(s => s.id === L1.alight_stop_id), b = ctx.stops(L2.train_id).find(s => s.id === L2.board_stop_id);
    if (!a || !b || !a.arr_time || !b.dep_time) return null;
    const ta = ctx.station(a.station_id).tz_hours, tb = ctx.station(b.station_id).tz_hours;
    return (((toM(hm(b.dep_time)) - tb * 60) - (toM(hm(a.arr_time)) - ta * 60)) % 1440 + 1440) % 1440
}
/* что сохранять в базу по выбранным «показывать станции» */
function legPayload(pos, train_id, boardId, alightId, visIds, stops) {
    const b = stops.find(s => s.id === boardId), a = stops.find(s => s.id === alightId);
    const vis = stops.filter(s => visIds.has(s.id) || s.id === boardId || s.id === alightId);
    const lo = Math.min(...vis.map(s => s.seq)), hi = Math.max(...vis.map(s => s.seq));
    const from = lo < b.seq ? stops.find(s => s.seq === lo) : null, to = hi > a.seq ? stops.find(s => s.seq === hi) : null;
    const hidden = stops.filter(s => s.seq >= Math.min(lo, b.seq) && s.seq <= Math.max(hi, a.seq) && !visIds.has(s.id) && s.id !== boardId && s.id !== alightId).map(s => s.id);
    return {pos, train_id, board_stop_id: boardId, alight_stop_id: alightId, show_from_stop_id: from ? from.id : null, show_to_stop_id: to ? to.id : null, hidden_stop_ids: hidden}
}
function visFromLeg(L, stops) { return new Set(legStops(L, stops).map(s => s.id)) }
function defaultVis(boardId, alightId, stops) {
    const b = stops.find(s => s.id === boardId), a = stops.find(s => s.id === alightId);
    return new Set(stops.filter(s => s.seq >= b.seq && s.seq <= a.seq).map(s => s.id))
}
/*ENDPURE*/

/* ================= интерфейс ================= */
const $ = s => document.querySelector(s);
const toast = t => { const e = $("#toast"); e.textContent = t; e.style.display = "block"; setTimeout(() => e.style.display = "none", 2400) };

/* авто-двоеточие в полях времени: вводите «1906» → «19:06» */
const fmtTime = (raw, del) => {
    let d = raw.replace(/\D/g, "");
    if (d[0] > "2") d = "0" + d;
    if (d[0] === "2" && d[1] > "3") d = "0" + d;
    if (d.length >= 3 && d[2] > "5") d = d.slice(0, 2) + "0" + d.slice(2);
    d = d.slice(0, 4);
    return d.length < 2 ? d : d.length === 2 ? (del ? d : d + ":") : d.slice(0, 2) + ":" + d.slice(2)
};
document.addEventListener("input", e => {
    const t = e.target;
    if (!t.matches || !t.matches("input.tm") || /[^\d:]/.test(t.value)) return;
    const v = fmtTime(t.value, /^delete/.test(e.inputType || ""));
    if (v !== t.value) { t.value = v; t.setSelectionRange(v.length, v.length) }
}, true);

let S = JSON.parse(localStorage.getItem("sb") || "null");
const auth = async (q, b) => {
    const r = await fetch(U + "/auth/v1/token?grant_type=" + q, {method: "POST", headers: {apikey: K, "Content-Type": "application/json"}, body: JSON.stringify(b)});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error_description || j.msg || "Ошибка входа");
    S = {a: j.access_token, r: j.refresh_token};
    localStorage.setItem("sb", JSON.stringify(S))
};
const logout = () => { S = null; localStorage.removeItem("sb"); showLogin() };
const errText = t => { try { const j = JSON.parse(t); return j.message || j.hint || t } catch (e) { return t } };
async function db(m, p, b, pref, retry = true) {
    const r = await fetch(U + "/rest/v1/" + p, {
        method: m,
        headers: {apikey: K, Authorization: "Bearer " + S.a, "Content-Type": "application/json", Prefer: pref || "return=representation"},
        body: b === undefined ? undefined : JSON.stringify(b)
    });
    if (r.status == 401 && retry) {
        try { await auth("refresh_token", {refresh_token: S.r}) } catch (e) { logout(); throw e }
        return db(m, p, b, pref, false)
    }
    const t = await r.text();
    if (!r.ok) throw new Error(errText(t));
    return t ? JSON.parse(t) : null
}
async function dbAll(path) { /* Supabase отдаёт максимум 1000 строк за запрос */
    let out = [], off = 0;
    for (;;) {
        const part = await db("GET", path + (path.includes("?") ? "&" : "?") + "limit=1000&offset=" + off);
        out = out.concat(part);
        if (part.length < 1000) return out;
        off += 1000
    }
}

/* ---------- данные ---------- */
let ST = [], TR = [], SP = [], CN = [], LG = [], RT = [];
let stById, trById, spByTrain, legsByConn, usedBy;
function index() {
    stById = new Map(ST.map(s => [s.id, s]));
    trById = new Map(TR.map(t => [t.id, t]));
    spByTrain = new Map(TR.map(t => [t.id, []]));
    SP.forEach(s => { (spByTrain.get(s.train_id) || []).push(s) });
    spByTrain.forEach(a => a.sort((x, y) => x.seq - y.seq));
    legsByConn = new Map();
    LG.forEach(l => { if (!legsByConn.has(l.connection_id)) legsByConn.set(l.connection_id, []); legsByConn.get(l.connection_id).push(l) });
    legsByConn.forEach(a => a.sort((x, y) => x.pos - y.pos));
    usedBy = new Map();
    LG.forEach(l => usedBy.set(l.train_id, (usedBy.get(l.train_id) || 0) + 1))
}
const CTX = {train: id => trById.get(id), stops: id => spByTrain.get(id) || [], station: id => stById.get(id)};
async function load() {
    [ST, TR, SP, CN, LG, RT] = await Promise.all([
        dbAll("stations?order=name_ru"), dbAll("trains?order=number"), dbAll("train_stops?order=train_id,seq"),
        dbAll("connections?order=route_slug,sort"), dbAll("connection_legs?order=connection_id,pos"), db("GET", "routes?order=sort")]);
    index()
}
const findStation = name => {
    const n = String(name || "").trim().toLowerCase();
    return ST.find(s => s.name_ru.toLowerCase() === n) || ST.find(s => (s.aliases || []).some(a => a.toLowerCase() === n))
};
const trainLabel = t => { const st = spByTrain.get(t.id) || []; return t.number + (st.length ? " · " + stById.get(st[0].station_id).name_ru + " → " + stById.get(st[st.length - 1].station_id).name_ru : "") };
const showErr = (el, e) => { el.innerHTML = '<div class="errbox">' + esc(e.message || e) + "</div>" };

/* ---------- вход ---------- */
function showLogin() {
    $("#out").style.display = "none";
    $("#app").innerHTML = `<section class="panel" style="max-width:380px;margin:0 auto"><h2>Вход</h2><label>Email</label><input id="em" type="email" autocomplete="username"><label>Пароль</label><input id="pw" type="password" autocomplete="current-password"><p><button id="go" class="pri">Войти</button></p><p id="le" class="err"></p></section>`;
    $("#go").onclick = async () => { try { await auth("password", {email: $("#em").value, password: $("#pw").value}); start() } catch (e) { $("#le").textContent = e.message } }
}
let TAB = "trains";
async function start() {
    $("#out").style.display = ""; $("#out").onclick = logout;
    try { await load() } catch (e) { return showLogin() }
    shell()
}
function shell() {
    $("#app").innerHTML = `<div class="tabs">${[["trains", "Поезда"], ["conns", "Варианты"], ["stations", "Станции"]].map(([k, v]) => `<button data-t="${k}" class="${TAB === k ? "on" : ""}">${v}</button>`).join("")}</div><div id="view"></div>`;
    document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { TAB = b.dataset.t; shell() });
    ({trains: viewTrains, conns: viewConns, stations: viewStations})[TAB]()
}

/* ================= станции ================= */
function viewStations() {
    const v = $("#view");
    const row = s => `<tr data-id="${s.id || ""}">
        <td><input type="text" data-f="name_ru" value="${esc(s.name_ru)}"></td>
        <td><input type="text" data-f="name_uk" value="${esc(s.name_uk)}"></td>
        <td><input type="text" data-f="name_en" value="${esc(s.name_en)}"></td>
        <td><input type="text" data-f="name_pl" value="${esc(s.name_pl)}"></td>
        <td><select data-f="tz_hours"><option value="1" ${s.tz_hours == 1 ? "selected" : ""}>UTC+1</option><option value="2" ${s.tz_hours == 2 ? "selected" : ""}>UTC+2</option></select></td>
        <td class="x"><button data-a="save">Сохранить</button> ${s.id ? '<button data-a="del">✕</button>' : ""}</td></tr>`;
    v.innerHTML = `<section class="panel"><h2>Станции <span class="muted">(${ST.length})</span></h2>
        <p class="muted">Названия на других языках сейчас берутся из i18n.js; если поле пустое, сайт покажет русское название. «в Хелме» и подобные формы пока остаются в i18n.js.</p>
        <div class="frow"><input type="text" id="sf" placeholder="Поиск станции" style="width:240px"><label><input type="checkbox" id="nt"> без перевода</label></div>
        <div id="se"></div>
        <table class="g"><thead><tr><th>Русское</th><th>Українська</th><th>English</th><th>Polski</th><th>Пояс</th><th></th></tr></thead><tbody id="stb"></tbody></table></section>`;
    const draw = () => {
        const q = $("#sf").value.trim().toLowerCase(), nt = $("#nt").checked;
        const list = ST.filter(s => (!q || s.name_ru.toLowerCase().includes(q)) && (!nt || !s.name_uk || !s.name_en || !s.name_pl));
        $("#stb").innerHTML = row({name_ru: "", tz_hours: 1}) + list.map(row).join("")
    };
    draw(); $("#sf").oninput = draw; $("#nt").onchange = draw;
    $("#stb").onclick = async e => {
        const b = e.target.closest("button"); if (!b) return;
        const tr = b.closest("tr"), id = tr.dataset.id, g = f => tr.querySelector(`[data-f=${f}]`).value.trim() || null;
        const body = {name_ru: g("name_ru"), name_uk: g("name_uk"), name_en: g("name_en"), name_pl: g("name_pl"), tz_hours: +g("tz_hours")};
        $("#se").innerHTML = "";
        try {
            if (b.dataset.a === "save") {
                if (!body.name_ru) throw new Error("Укажите русское название");
                if (id) await db("PATCH", "stations?id=eq." + id, body); else await db("POST", "stations", body)
            } else {
                if (!confirm("Удалить станцию?")) return;
                await db("DELETE", "stations?id=eq." + id)
            }
            await load(); toast("Готово"); viewStations()
        } catch (er) { showErr($("#se"), er.message.includes("violates foreign key") ? "Станция используется в расписании поездов, сначала уберите её оттуда" : er) }
    }
}

/* ================= поезда ================= */
let TSEL = null, TD = null; /* TSEL — id поезда или "new"; TD — редактируемая копия {t, rows} */
function openTrain(id) {
    TSEL = id;
    if (id === "new") TD = {t: {number: "", freq: "", badge: "", note: ""}, rows: [{name: "", arr: "", dep: "", chk: false}, {name: "", arr: "", dep: "", chk: false}]};
    else {
        const t = trById.get(id);
        TD = {t: {...t, badge: t.badge || "", note: t.note || ""}, rows: (spByTrain.get(id) || []).map(s => ({id: s.id, name: stById.get(s.station_id).name_ru, arr: hm(s.arr_time), dep: hm(s.dep_time), chk: s.needs_check}))}
    }
}
function viewTrains() {
    const v = $("#view");
    v.innerHTML = `<div class="two"><section class="panel"><h2>Поезда</h2>
        <div class="frow"><input type="text" id="tf" placeholder="Поиск" style="width:100%"></div>
        <label class="muted"><input type="checkbox" id="tc"> только с неподтверждённым временем</label>
        <p><button id="tn" class="pri">+ Новый поезд</button></p><div class="list" id="tl"></div></section>
        <section class="panel" id="te"></section></div>
        <datalist id="stl">${ST.map(s => `<option value="${esc(s.name_ru)}">`).join("")}</datalist>`;
    const draw = () => {

        let total = 0, ok = true;
        legs.forEach((l, i) => { const m = legMinutes(l, CTX); if (m == null) ok = false; else total += m; if (i > 0) { const w = waitMinutes(legs[i - 1], l, CTX); if (w == null) ok = false; else total += w } });
        pv.innerHTML = '<div class="muted" style="margin-bottom:6px">Так карточка выглядит на сайте' + (ok ? " · общее время в пути по расписанию: <b>" + durTxt(total) + "</b>" : "") + ":</div>" + optHtml({dsl, note: E.C.note || ""})
    } catch (e) { pv.innerHTML = '<div class="errbox">' + esc(e.message) + "</div>" }
}
async function saveConn() {
    const box = $("#cerr"); box.innerHTML = "";
    if (!E.C.route_slug) return showErr(box, "Выберите направление");
    if (!readyLegs()) return showErr(box, "Заполните все поезда: поезд, где садимся и где выходим");
    const legs = legPayloads(), first = CTX.stops(legs[0].train_id).find(s => s.id === legs[0].board_stop_id);
    const dep = toM(E.C.head_dep_time || hm(first.dep_time)), C = E.C;
    const body = {id: E.id, route_slug: C.route_slug, head_from: C.head_from, head_to: C.head_to, head_dep_time: C.head_dep_time || null, head_arr_time: C.head_arr_time || null,
        head_dur: C.head_dur, head_tag: C.head_tag, note: C.note, sort: dep == null ? 0 : dep, active: C.active, legs};
    try {
        await db("POST", "rpc/save_connection", {p: body});
        await load(); toast("Вариант сохранён"); E = null; viewConns()
    } catch (e) { showErr(box, e) }
}

if (S) start(); else showLogin();
})();

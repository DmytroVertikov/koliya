<script>
    const FROM = "Краков", TO = "Днепр", BACK = "ua-pl"; // FROM/TO: русские названия, как в шапке карточки в админке
    
    const BUY = `<section class="panel"><h2>How to buy tickets</h2>
<div class="buy one">

<div><h3>With a transfer in Przemyśl</h3><ol class="steps">
<li>Open the Ukrzaliznytsia app, choose the route Przemyśl → Dnipro and the travel date. Sales open 20 days before departure at 09:00 Kyiv time. Choose a suitable train and pay for the ticket.</li>
<li>Buy the Kraków → Przemyśl ticket separately from the Polish carrier PKP Intercity, on intercity.pl or in the PKP Intercity app. You can also buy it on koleo.pl or in the KOLEO app.</li>
<li>When choosing the Kraków → Przemyśl train, use the options and timetable shown above on this page. Allow for the departure time of the Przemyśl → Dnipro train and the length of the transfer.</li>
<li>After buying, save both e-tickets on your phone. Before you travel, check the dates, departure times and arrival stations.</li></ol>
<a class="btn pri" href="https://app.uz.gov.ua/start" target="_blank" rel="noopener">Buy the Przemyśl → Dnipro ticket in the UZ app</a>
<a class="btn" href="https://www.intercity.pl/" target="_blank" rel="noopener">Buy the Kraków → Przemyśl ticket on PKP Intercity</a></div>
</div>
<p class="buy-note">Train schedules may change. Check the latest information in the UZ app and on the PKP Intercity website.</p></section>`;
    const app = document.getElementById("app");
    const norm = s => String(s || "").trim().toLowerCase();
    fetch(U + "/rest/v1/options?order=sort", {headers: {apikey: K, Authorization: "Bearer " + K}}).then(r => {
        if (!r.ok) throw 0;
        return r.json()
    }).then(all => {
        const list = all.filter(o => o.active !== false).map(o => {
            const p = parseOption(o.dsl);
            return {o, p, h: p.head || deriveHead(p.legs)}
        }).filter(x => x.p.legs.length && norm(x.h.from).startsWith(norm(FROM)) && norm(x.h.to).startsWith(norm(TO)));
        const HAS_DIRECT = false; /* false: страница без прямого поезда, все варианты идут как «с пересадкой» */
        const direct = HAS_DIRECT ? list.filter(x => x.p.legs.length === 1) : [], transfer = HAS_DIRECT ? list.filter(x => x.p.legs.length > 1) : list;
        if (!list.length) {
            app.innerHTML = `<div class="panel"><h2>No options yet</h2><p>Add them in the admin panel.</p></div>`;
            return
        }
        app.innerHTML = ""
            + (transfer.length ? `<h2 class="sub">With a transfer in Przemyśl</h2><div class="cols" style="margin-top:16px">${transfer.map(x => optHtml(x.o)).join("")}</div>` : "");
        
        /*B*/document.querySelectorAll(".swap").forEach(s => s.insertAdjacentHTML("afterend", `<div class="swap border">🛂 Border control takes place in Przemyśl before departure</div>`));/*/B*/
    }).catch(() => {
        app.innerHTML = `<div class="panel"><h2>Could not load the data</h2><p>Please refresh the page later.</p></div>`
    });
    const here = location.pathname.split("/").pop() || "index.html",
        others = ((window.CFG && CFG.PAGES) || []).filter(p => p.href !== here);
    document.getElementById("more").innerHTML = BUY + `<section class="panel"><h2>More routes</h2><div class="grid" style="margin-top:12px"><a class="btn" href="./#${BACK}">← Ukraine — Poland</a>${others.map(p => `<a class="btn" href="${esc(p.href)}">${esc(trRoute(p.title))}</a>`).join("")}<a class="btn" href="./">All countries</a></div></section>`;
</script>

        <h1>By train: Kyiv → Prague</h1>
        <p id="lead">Train timetable Kyiv — Prague: options with a transfer in Chop. Journey time, stops and ticket information.</p></div>
</header>
<main class="wrap"><a class="back" href="./">← Home</a> <a class="back" href="./#ua-cz">All routes: Ukraine — Czechia</a> <a class="back" href="prague-kyiv.html">🔄 Prague → Kyiv</a>

<script>window.LANG = "en";</script>
<script src="../config.js"></script>
<script src="../i18n.js"></script>
<script src="../common.js"></script>
<script>
    const SPLIT = [["Перемышль","With a transfer in Przemyśl",1],["Чоп","With a transfer in Chop",0]]; /* [станция пересадки, заголовок, пограничный контроль]: страница делится на группы по пересадке */
    const FROM = "Киев", TO = "Прага", BACK = "cz-ua"; // FROM/TO: русские названия, как в шапке карточки в админке
    
    const BUY = `<section class="panel"><h2>How to buy tickets</h2>
<div class="buy three">




<div><h3>With a transfer in Przemyśl · UZ + ČD</h3><ol class="steps">
<li>Open the Ukrzaliznytsia app, choose the route Kyiv → Przemyśl and the travel date. Sales open 20 days before departure at 08:00 Kyiv time. Choose train 051К and pay for the ticket.</li>
<li>Buy the Przemyśl → Prague ticket for EC and IC trains separately from the Czech carrier České dráhy (ČD), on cd.cz or in the ČD My Train (Můj vlak) app.</li>
<li>After buying, save both e-tickets on your phone. Before you travel, check the dates, departure times and arrival stations.</li></ol>
<a class="btn pri" href="https://app.uz.gov.ua/start" target="_blank" rel="noopener">Buy the Kyiv → Przemyśl ticket in the UZ app</a>
<a class="btn" href="https://www.cd.cz/spojeni-a-jizdenka/" target="_blank" rel="noopener">Buy the Przemyśl → Prague ticket on ČD</a></div>
<div><h3>With a transfer in Przemyśl · UZ + RegioJet</h3><ol class="steps">
<li>Open the Ukrzaliznytsia app, choose the route Kyiv → Przemyśl and the travel date. Sales open 20 days before departure at 08:00 Kyiv time. Choose train 715К and pay for the ticket.</li>
<li>Buy the Przemyśl → Prague ticket for the RJ train separately from the Czech carrier RegioJet, on regiojet.cz or in the RegioJet app.</li>
<li>After buying, save both e-tickets on your phone. Before you travel, check the dates, departure times and arrival stations.</li></ol>
<a class="btn pri" href="https://app.uz.gov.ua/start" target="_blank" rel="noopener">Buy the Kyiv → Przemyśl ticket in the UZ app</a>
<a class="btn" href="https://regiojet.cz/" target="_blank" rel="noopener">Buy the Przemyśl → Prague ticket on RegioJet</a></div>
<div><h3>With a transfer in Chop · UZ + RegioJet</h3><ol class="steps">
<li>Open the Ukrzaliznytsia app, choose the route Kyiv → Chop and the travel date. Sales open 20 days before departure at 08:00 Kyiv time. Choose train 059К and pay for the ticket.</li>
<li>Buy the Chop → Prague ticket for the RJ train separately from the Czech carrier RegioJet, on regiojet.cz or in the RegioJet app.</li>
<li>After buying, save both e-tickets on your phone. Before you travel, check the dates, departure times and arrival stations.</li></ol>
<a class="btn pri" href="https://app.uz.gov.ua/start" target="_blank" rel="noopener">Buy the Kyiv → Chop ticket in the UZ app</a>
<a class="btn" href="https://regiojet.cz/" target="_blank" rel="noopener">Buy the Chop → Prague ticket on RegioJet</a></div>
</div>
<p class="buy-note">Train schedules may change. Check the latest information in the UZ app, in the ČD My Train app and on the RegioJet website.</p></section>`;
    const app = document.getElementById("app");
    const norm = s => String(s || "").trim().toLowerCase();
    fetch(U + "/rest/v1/options?order=sort", {headers: {apikey: K, Authorization: "Bearer " + K}}).then(r => {
        if (!r.ok) throw 0;
        return r.json()
    }).then(all => {
        const list = all.filter(o => o.active !== false).map(o => {
            const p = parseOption(o.dsl);
            return {o, p, h: p.head || deriveHead(p.legs)}
        }).filter(x => x.p.legs.length && norm(x.h.from).startsWith(norm(FROM)) && norm(x.h.to).startsWith(norm(TO)));
        const HAS_DIRECT = false; /* false: страница без прямого поезда, все варианты идут как «с пересадкой» */
        const direct = HAS_DIRECT ? list.filter(x => x.p.legs.length === 1) : [], transfer = HAS_DIRECT ? list.filter(x => x.p.legs.length > 1) : list;
        if (!list.length) {
            app.innerHTML = `<div class="panel"><h2>No options yet</h2><p>Add them in the admin panel.</p></div>`;
            return
        }
        app.innerHTML = ""
            + (() => {
            const block = (arr, h, b) => arr.length ? `<h2 class="sub${arr.length === 1 ? " c" : ""}">${h}</h2><div class="cols${arr.length === 1 ? " one" : ""}"${b ? ' data-b="1"' : ""} style="margin-top:16px">${arr.map(x => optHtml(x.o)).join("")}</div>` : "";
            if (!SPLIT.length) return block(transfer, "With a transfer");
            const at = x => { const s = x.p.legs[0].stops; return norm(s[s.length - 1].name) }; /* станция первой пересадки */
            const used = new Set();
            const parts = SPLIT.map(s => { const g = transfer.filter(x => at(x).startsWith(norm(s[0]))); g.forEach(x => used.add(x)); return block(g, esc(s[1]), s[2]) });
            return parts.join("") + block(transfer.filter(x => !used.has(x)), "With a transfer")
        })();
        
        /*B*/document.querySelectorAll((SPLIT.length ? ".cols[data-b] " : "") + ".swap").forEach(s => s.insertAdjacentHTML("afterend", `<div class="swap border">🛂 Border control takes place in Przemyśl after arrival</div>`));/*/B*/
    }).catch(() => {
        app.innerHTML = `<div class="panel"><h2>Could not load the data</h2><p>Please refresh the page later.</p></div>`
    });
    const here = location.pathname.split("/").pop() || "index.html",
        others = ((window.CFG && CFG.PAGES) || []).filter(p => p.href !== here);
    document.getElementById("more").innerHTML = BUY + `<section class="panel"><h2>More routes</h2><div class="grid" style="margin-top:12px"><a class="btn" href="./#${BACK}">← Czechia — Ukraine</a>${others.map(p => `<a class="btn" href="${esc(p.href)}">${esc(trRoute(p.title))}</a>`).join("")}<a class="btn" href="./">All countries</a></div></section>`;
</script>

<script>window.LANG = "en";</script>

<script>
    const FROM = "Бухарест", TO = "Киев", BACK = "ua-ro"; // FROM/TO: русские названия, как в шапке карточки в админке
    /*D*//*/D*/
    const BUY = `<section class="panel"><h2>How to buy tickets</h2>
<div class="buy one">
<!--D--><div class="d"><h3>Direct train</h3><ol class="steps">
<li>Open the Ukrzaliznytsia app, choose the route Bucharest → Kyiv and the travel date. Sales open 20 days before departure at 08:00 Kyiv time.</li>
<li>Pick a seat and pay by bank card. The e-ticket will appear in the app. Show it with your passport when boarding.</li></ol>
<a class="btn" href="https://app.uz.gov.ua/start" target="_blank" rel="noopener">Buy the Bucharest → Kyiv ticket in the UZ app</a></div><!--/D-->



</div>
<p class="buy-note">Train schedules may change. Check the latest information in the UZ app.</p></section>`;
    const app = document.getElementById("app");
    const norm = s => String(s || "").trim().toLowerCase();
    fetch(U + "/rest/v1/options?order=sort", {headers: {apikey: K, Authorization: "Bearer " + K}}).then(r => {
        if (!r.ok) throw 0;
        return r.json()
    }).then(all => {
        const list = all.filter(o => o.active !== false).map(o => {
            const p = parseOption(o.dsl);
            return {o, p, h: p.head || deriveHead(p.legs)}
        }).filter(x => x.p.legs.length && norm(x.h.from).startsWith(norm(FROM)) && norm(x.h.to).startsWith(norm(TO)));
        const HAS_DIRECT = true; /* false: страница без прямого поезда, все варианты идут как «с пересадкой» */
        const direct = HAS_DIRECT ? list.filter(x => x.p.legs.length === 1) : [], transfer = HAS_DIRECT ? list.filter(x => x.p.legs.length > 1) : list;
        if (!list.length) {
            app.innerHTML = `<div class="panel"><h2>No options yet</h2><p>Add them in the admin panel.</p></div>`;
            return
        }
        app.innerHTML = ""/*D*/ + (direct.length ? `<h2 class="sub" style="margin-top:6px">Direct train <small>no transfers</small></h2><div class="direct direct-wrap" style="margin-top:16px">${direct.map(x => optHtml(x.o)).join("")}</div>` : "")
            + (direct.length && transfer.length ? `<aside class="ad wide" data-slot="mid" hidden></aside>` : "")/*/D*/
            + (transfer.length ? `<h2 class="sub${transfer.length === 1 ? " c" : ""}">With a convenient same-platform transfer in Chełm</h2><div class="cols${transfer.length === 1 ? " one" : ""}" style="margin-top:16px">${transfer.map(x => optHtml(x.o)).join("")}</div>` : "");
        /*D*//*/D*/
        
    }).catch(() => {
        app.innerHTML = `<div class="panel"><h2>Could not load the data</h2><p>Please refresh the page later.</p></div>`
    });
    const here = location.pathname.split("/").pop() || "index.html",
        others = ((window.CFG && CFG.PAGES) || []).filter(p => p.href !== here);
    document.getElementById("more").innerHTML = BUY + `<section class="panel"><h2>More routes</h2><div class="grid" style="margin-top:12px"><a class="btn" href="./#${BACK}">← Ukraine — Romania</a>${others.map(p => `<a class="btn" href="${esc(p.href)}">${esc(trRoute(p.title))}</a>`).join("")}<a class="btn" href="./">All countries</a></div></section>`;
</script>

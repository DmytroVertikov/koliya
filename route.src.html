<!DOCTYPE html>
<!-- build {{stamp}} -->
<html lang="{{lang}}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{r_title}}</title>
    <meta name="description" content="{{r_desc}}">
    <meta name="theme-color" content="#12145c">
    <link rel="canonical" href="{{canon}}">
{{alts}}
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Колія">
    <meta property="og:title" content="{{r_title}}">
    <meta property="og:description" content="{{r_desc}}">
    <meta property="og:url" content="{{canon}}">
    <meta property="og:locale" content="{{ogloc}}">
{{ogalt}}
    <meta property="og:image" content="{{ogimg}}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ogtext}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{ogimg}}">
    <meta name="twitter:image:alt" content="{{ogtext}}">
    <script type="application/ld+json">{{jsonld}}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="{{base}}style.css">
    <style>
        .wrap {
            max-width: 1080px
        }

        .cols {
            display: grid;
            grid-template-columns:minmax(0, 1fr);
            gap: 18px
        }

        .cols .opt {
            margin-top: 0
        }

        /* один вариант: карточка и заголовок по центру */
        .cols.one {
            grid-template-columns: minmax(0, 1fr)
        }

        h2.sub.c {
            text-align: left
        }

        .cols .board, .direct .board {
            --t: clamp(32px, 4vw, 46px)
        }

        .direct .opt {
            margin-top: 0
        }

        /* прямой поезд: зелёный цвет вместо синего */
        .direct .board {
            background: linear-gradient(160deg, #12875a, #0a4d34)
        }

        .direct .opt {
            border-color: #12875a;
            box-shadow: 0 14px 36px -14px rgba(18, 135, 90, .55)
        }

        .direct .tl {
            --rail: #12875a
        }

        .direct .leg h4 {
            color: #0a6b46;
            background: #dcf5e9
        }

        .direct .tag {
            background: var(--acc);
            color: var(--accink)
        }

        @media (prefers-color-scheme: dark) {
            .direct .leg h4 {
                color: #7be0b0;
                background: #12392b
            }
        }

        .direct .body.two {
            display: grid;
            grid-template-columns:minmax(0, 1fr) minmax(0, 1fr);
            gap: 0 28px;
            align-items: start
        }

        .direct .body.two .note {
            grid-column: 1/-1
        }

        .coach {
            grid-column: 2;
            grid-row: 1;
            margin-top: 16px;
            padding: 18px 20px;
            border-radius: 18px;
            background: #dcf5e9;
            color: #0a4d34;
            border: 1px solid rgba(18, 135, 90, .25)
        }

        .coach h4 {
            margin: 0 0 8px;
            font-family: var(--disp);
            font-weight: 800;
            font-size: 17px
        }

        .coach p {
            margin: 0;
            font-size: 15.5px;
            line-height: 1.6
        }

        .coach p + p {
            margin-top: 8px
        }

        @media (prefers-color-scheme: dark) {
            .coach {
                background: #12392b;
                color: #bff0d8;
                border-color: rgba(123, 224, 176, .25)
            }
        }

        .buy {
            display: grid;
            grid-template-columns:repeat(2, minmax(0, 1fr));
            gap: 18px;
            margin-top: 14px
        }

        .buy > div {
            background: var(--soft);
            border-radius: 18px;
            padding: 18px 20px
        }

        .buy > div.d {
            background: #dcf5e9;
            color: #0a4d34
        }

        .buy > div.d .steps li:before {
            background: #12875a;
            color: #fff
        }

        .buy h3 {
            margin: 0 0 2px;
            font-family: var(--disp);
            font-weight: 800;
            font-size: 17px
        }

        .buy .steps {
            margin-top: 12px
        }

        .buy .btn {
            margin-top: 14px
        }

        .buy .btn:not(.pri) {
            box-shadow: inset 0 0 0 2px var(--brand)
        }

        .buy > div.d .btn {
            background: #fff;
            color: #0a6b46;
            box-shadow: inset 0 0 0 2px #12875a
        }

        .buy > div:not(.d) .btn:not(.pri) {
            background: var(--brand);
            color: var(--card);
            box-shadow: none
        }

        .buy.one {
            grid-template-columns: minmax(0, 1fr)
        }

        .buy.three {
            grid-template-columns:repeat(3, minmax(0, 1fr))
        }

        .buy.two {
            grid-template-columns:repeat(2, minmax(0, 1fr))
        }

        @media (max-width: 980px) {
            .buy.two, .buy.three {
                grid-template-columns: minmax(0, 1fr)
            }
        }

        .buy-note {
            margin-top: 16px !important;
            font-size: 14px
        }

        @media (prefers-color-scheme: dark) {
            .buy > div.d {
                background: #12392b;
                color: #bff0d8
            }

            .buy > div.d .btn {
                background: #0f2c21;
                color: #7be0b0
            }
        }

        h2.sub small {
            font-family: var(--body);
            font-weight: 600;
            font-size: 14px;
            color: var(--mute);
            margin-left: 8px
        }

        .direct-wrap {
            display: grid;
            gap: 18px
        }

        @media (max-width: 760px) {
            .buy {
                grid-template-columns:1fr
            }

            .direct .body.two {
                display: block
            }

            .cols {
                grid-template-columns:1fr
            }

            .cols .board, .direct .board {
                --t: clamp(34px, 10vw, 60px)
            }
        }
    </style>
</head>
<body>
<header>
    <div class="wrap"><div class="hbar"><a class="logo" href="{{home}}"><span class="rails" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14"/><circle cx="9" cy="14" r=".8" fill="currentColor"/><circle cx="15" cy="14" r=".8" fill="currentColor"/><path d="M8 21l2-4M16 21l-2-4"/></svg></span><span class="wm">КОЛІЯ</span></a><nav class="lang" aria-label="Language">{{langs}}</nav></div>
        <svg class="hero-art" viewBox="-24 -16 468 206" aria-hidden="true" focusable="false"><circle cx="410" cy="30" r="30" fill="#fff" fill-opacity=".06"/><circle cx="410" cy="30" r="16" fill="#fff" fill-opacity=".08"/><path d="M10 150C90 150 110 60 190 78S320 140 410 30" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round"/><circle cx="190" cy="78" r="6" fill="#fff" fill-opacity=".85"/><circle cx="300" cy="113" r="5" fill="#fff" fill-opacity=".6"/><circle cx="410" cy="30" r="8" fill="#fff"/><g transform="translate(10 150)"><circle r="12" fill="#ffd23f"/><path d="M-12 0A12 12 0 0 1 12 0Z" fill="#3b82f6"/></g></svg>
        <h1>{{r_h1}}</h1>
        <p id="lead">{{r_lead}}</p></div>
</header>
<main class="wrap"><a class="back" href="{{home}}">{{back.home}}</a> <a class="back" href="{{home}}#{{hash}}">{{r_all}}</a> <a class="back" href="{{rev}}">🔄 {{chipRev}}</a>
    <p class="chk" id="chk" hidden>📅 {{d.checked}} <b></b></p>
    <div id="app"><p>{{loading}}</p></div>
    <div id="more">{{buyhtml}}</div> <!-- блок «Как купить билеты» лежит в HTML (виден поисковикам без JS), ниже JS добавляет «Ещё маршруты» -->
</main>
<div class="wrap"><aside class="ad wide" data-slot="bottom" hidden></aside></div>
<footer class="wrap" id="site-footer"></footer>
<script>window.LANG = "{{lang}}";</script>
<script src="{{base}}config.js"></script>
<script src="{{base}}pages.js"></script>
<script src="{{base}}dict/{{lang}}.js"></script>
<script src="{{base}}common.js?v={{ver}}"></script>
<script src="{{base}}consent.js?v={{ver}}"></script>
<script>
    const CARDS = {{cards}}; /* настройки карточек (что показывать на странице); готовый HTML карточек уже лежит в #app (build.js), JS обновляет его свежими данными */
    const FROM = "{{FROM}}", TO = "{{TO}}", BACK = "{{BACK}}"; // FROM/TO: русские названия, как в шапке карточки в админке
    /*D*//*C*/const COACH = `<aside class="coach"><p>{{coach}}</p></aside>`;/*/C*//*/D*/
    const app = document.getElementById("app");
    const norm = s => String(s || "").trim().toLowerCase();
    fetch(U + "/rest/v1/options?order=sort", {headers: {apikey: K, Authorization: "Bearer " + K}}).then(r => {
        if (!r.ok) throw 0;
        return r.json()
    }).then(all => {
        const {list, html} = renderCards(all, CARDS);
        app.innerHTML = html;
        /* «Проверено»: самая свежая дата сохранения среди показанных вариантов (в админке есть кнопка «Подтвердить актуальность») */
        const ck = list.map(x => Date.parse(x.o.updated_at)).filter(Boolean), ce = document.getElementById("chk");
        if (ck.length && ce) {
            const d = new Date(Math.max(...ck)), p2 = n => String(n).padStart(2, "0");
            ce.querySelector("b").textContent = p2(d.getDate()) + "." + p2(d.getMonth() + 1) + "." + d.getFullYear();
            ce.hidden = false
        }
        /* LEADX: если среди вариантов есть пересадка на этой станции, подзаголовок страницы берётся из LEADM (с этой станцией) */
        const LEADX = "{{leadx}}", LEADM = {{leadm}};
        if (LEADX && LEADM && list.some(x => x.p.legs.length > 1 && (s => norm(s[s.length - 1].name).startsWith(norm(LEADX)))(x.p.legs[0].stops))) document.getElementById("lead").textContent = LEADM;
        if (!list.length) return;
        /*D*//*C*/document.querySelectorAll(".direct .body").forEach(b => {
            b.classList.add("two");
            b.insertAdjacentHTML("beforeend", COACH)
        });/*/C*//*/D*/
        /*B*/document.querySelectorAll(".opt[data-b"+"] .swap").forEach(s => s.insertAdjacentHTML("afterend", `<div class="swap border">🛂 {{border}}</div>`));/*/B*/
    }).catch(() => {
        if (!app.querySelector(".opt")) app.innerHTML = `<div class="panel"><h2>{{err.h}}</h2><p>{{err.p}}</p></div>` /* карточки из сборки остаются, если база недоступна */
    });
    document.getElementById("more").insertAdjacentHTML("beforeend", moreRoutes({h: "{{more.h}}", rev: "{{more.rev}}", from: "{{more.from}}", to: "{{more.to}}", dir: "{{more.dir}}", all: "{{more.all}}", home: "{{home}}", hash: "{{hash}}"}));
</script>
</body>
</html>

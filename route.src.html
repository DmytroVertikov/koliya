<!DOCTYPE html>
<!-- build {{stamp}} -->
<html lang="{{lang}}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{r_title}}</title>
    <meta name="description" content="{{r_desc}}">
    <meta name="theme-color" content="#12145c">
    <link rel="canonical" href="{{canon}}">
{{alts}}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="{{base}}style.css">
    <style>
        .wrap {
            max-width: 1080px
        }

        .cols {
            display: grid;
            grid-template-columns:minmax(0, 1fr);
            gap: 18px
        }

        .cols .opt {
            margin-top: 0
        }

        /* один вариант: карточка и заголовок по центру */
        .cols.one {
            grid-template-columns: minmax(0, 1fr)
        }

        h2.sub.c {
            text-align: left
        }

        .cols .board, .direct .board {
            --t: clamp(32px, 4vw, 46px)
        }

        .direct .opt {
            margin-top: 0
        }

        /* прямой поезд: зелёный цвет вместо синего */
        .direct .board {
            background: linear-gradient(160deg, #12875a, #0a4d34)
        }

        .direct .opt {
            border-color: #12875a;
            box-shadow: 0 14px 36px -14px rgba(18, 135, 90, .55)
        }

        .direct .tl {
            --rail: #12875a
        }

        .direct .leg h4 {
            color: #0a6b46;
            background: #dcf5e9
        }

        .direct .tag {
            background: var(--acc);
            color: var(--accink)
        }

        @media (prefers-color-scheme: dark) {
            .direct .leg h4 {
                color: #7be0b0;
                background: #12392b
            }
        }

        .direct .body.two {
            display: grid;
            grid-template-columns:minmax(0, 1fr) minmax(0, 1fr);
            gap: 0 28px;
            align-items: start
        }

        .direct .body.two .note {
            grid-column: 1/-1
        }

        .coach {
            grid-column: 2;
            grid-row: 1;
            margin-top: 16px;
            padding: 18px 20px;
            border-radius: 18px;
            background: #dcf5e9;
            color: #0a4d34;
            border: 1px solid rgba(18, 135, 90, .25)
        }

        .coach h4 {
            margin: 0 0 8px;
            font-family: var(--disp);
            font-weight: 800;
            font-size: 17px
        }

        .coach p {
            margin: 0;
            font-size: 15.5px;
            line-height: 1.6
        }

        .coach p + p {
            margin-top: 8px
        }

        @media (prefers-color-scheme: dark) {
            .coach {
                background: #12392b;
                color: #bff0d8;
                border-color: rgba(123, 224, 176, .25)
            }
        }

        .buy {
            display: grid;
            grid-template-columns:repeat(2, minmax(0, 1fr));
            gap: 18px;
            margin-top: 14px
        }

        .buy > div {
            background: var(--soft);
            border-radius: 18px;
            padding: 18px 20px
        }

        .buy > div.d {
            background: #dcf5e9;
            color: #0a4d34
        }

        .buy > div.d .steps li:before {
            background: #12875a;
            color: #fff
        }

        .buy h3 {
            margin: 0 0 2px;
            font-family: var(--disp);
            font-weight: 800;
            font-size: 17px
        }

        .buy .steps {
            margin-top: 12px
        }

        .buy .btn {
            margin-top: 14px
        }

        .buy .btn:not(.pri) {
            box-shadow: inset 0 0 0 2px var(--brand)
        }

        .buy > div.d .btn {
            background: #fff;
            color: #0a6b46;
            box-shadow: inset 0 0 0 2px #12875a
        }

        .buy > div:not(.d) .btn:not(.pri) {
            background: var(--brand);
            color: var(--card);
            box-shadow: none
        }

        .buy.one {
            grid-template-columns: minmax(0, 1fr)
        }

        .buy.three {
            grid-template-columns:repeat(3, minmax(0, 1fr))
        }

        .buy.two {
            grid-template-columns:repeat(2, minmax(0, 1fr))
        }

        @media (max-width: 980px) {
            .buy.two, .buy.three {
                grid-template-columns: minmax(0, 1fr)
            }
        }

        .buy-note {
            margin-top: 16px !important;
            font-size: 14px
        }

        @media (prefers-color-scheme: dark) {
            .buy > div.d {
                background: #12392b;
                color: #bff0d8
            }

            .buy > div.d .btn {
                background: #0f2c21;
                color: #7be0b0
            }
        }

        h2.sub small {
            font-family: var(--body);
            font-weight: 600;
            font-size: 14px;
            color: var(--mute);
            margin-left: 8px
        }

        .direct-wrap {
            display: grid;
            gap: 18px
        }

        @media (max-width: 760px) {
            .buy {
                grid-template-columns:1fr
            }

            .direct .body.two {
                display: block
            }

            .cols {
                grid-template-columns:1fr
            }

            .cols .board, .direct .board {
                --t: clamp(34px, 10vw, 60px)
            }
        }
    </style>
</head>
<body>
<header>
    <div class="wrap"><nav class="lang">{{langs}}</nav><a class="logo" href="{{home}}"><span class="rails">🚆</span> КОЛІЯ</a>
        <h1>{{r_h1}}</h1>
        <p id="lead">{{r_lead}}</p></div>
</header>
<main class="wrap"><a class="back" href="{{home}}">{{back.home}}</a> <a class="back" href="{{home}}#{{hash}}">{{r_all}}</a> <a class="back" href="{{rev}}">🔄 {{chipRev}}</a>
    <p class="chk" id="chk" hidden>📅 {{d.checked}} <b></b></p>
    <div id="app"><p>{{loading}}</p></div>
    <div id="more"></div>
</main>
<div class="wrap"><aside class="ad wide" data-slot="bottom" hidden></aside></div>
<footer class="wrap" id="site-footer"></footer>
<script>window.LANG = "{{lang}}";</script>
<script src="{{base}}config.js"></script>
<script src="{{base}}i18n.js"></script>
<script src="{{base}}common.js"></script>
<script>
    const SPLIT = {{split}}; /* [станция пересадки, заголовок, пограничный контроль]: страница делится на группы по пересадке */
    const FROM = "{{FROM}}", TO = "{{TO}}", BACK = "{{BACK}}"; // FROM/TO: русские названия, как в шапке карточки в админке
    /*D*//*C*/const COACH = `<aside class="coach"><p>{{coach}}</p></aside>`;/*/C*//*/D*/
    const BUY = `<section class="panel" id="buy"><h2>{{buy.h}}</h2>
<div class="buy{{buyone}}">
<!--D--><div class="d"><h3>{{buy.d.h}}</h3><ol class="steps">
<li>{{buy.d.s2}}</li>
<li>{{buy.d.s3}}</li></ol>
<a class="btn" href="https://app.uz.gov.ua/start" target="_blank" rel="noopener">{{buy.d.btn}}</a></div><!--/D-->
<!--T--><div><h3>{{buy.t.h}}</h3><ol class="steps">
<li>{{buy.t.s1x}}</li>
<li>{{buy.t.s2}}</li>
<!--T3--><li>{{buy.t3}}</li><!--/T3-->
<li>{{buy.t.s4}}</li></ol>
<a class="btn pri" href="https://app.uz.gov.ua/start" target="_blank" rel="noopener">{{buy.t.b1}}</a>
<a class="btn" href="{{buy.t.url}}" target="_blank" rel="noopener">{{buy.t.b2}}</a></div><!--/T-->
<!--H--><div><h3>{{buy.h3}}</h3><ol class="steps">
<li>{{buy.h.s1}}</li>
<li>{{buy.h.s2}}</li>
<li>{{buy.t.s4}}</li></ol>
{{buy.h.btns}}</div><!--/H-->
<!--A--><div><h3>{{buy.t.h}}</h3><ol class="steps">
<li>{{buy.a.s1}}</li>
<li>{{buy.a.s2}}</li>
<li>{{buy.a.s3}}</li></ol>
<a class="btn pri" href="https://app.uz.gov.ua/start" target="_blank" rel="noopener">{{buy.a.btn}}</a></div><!--/A-->
{{buycols}}
</div>
<p class="buy-note">{{buy.notex}}</p></section>`;
    const app = document.getElementById("app");
    const HOWBAR = `<a class="howbar" href="#buy"><span class="hi" aria-hidden="true">i</span><span><b>{{d.howq}}</b><small>{{d.hows}}</small></span><span class="go">{{d.how}} →</span></a>`;
    const norm = s => String(s || "").trim().toLowerCase();
    fetch(U + "/rest/v1/options?order=sort", {headers: {apikey: K, Authorization: "Bearer " + K}}).then(r => {
        if (!r.ok) throw 0;
        return r.json()
    }).then(all => {
        const list = all.filter(o => o.active !== false).map(o => {
            const p = parseOption(o.dsl);
            return {o, p, h: p.head || deriveHead(p.legs)}
        }).filter(x => x.p.legs.length && norm(x.h.from).startsWith(norm(FROM)) && norm(x.h.to).startsWith(norm(TO)))
            /* всегда по времени отправления; одинаковое время сохраняет порядок из базы */
            .sort((a, b) => (m => m ? m[1] * 60 + +m[2] : 1e4)(String(a.h.ft).match(/(\d{1,2}):(\d{2})/)) - (m => m ? m[1] * 60 + +m[2] : 1e4)(String(b.h.ft).match(/(\d{1,2}):(\d{2})/)));
        /* «Проверено»: самая свежая дата сохранения среди показанных вариантов (в админке есть кнопка «Подтвердить актуальность») */
        const ck = list.map(x => Date.parse(x.o.updated_at)).filter(Boolean), ce = document.getElementById("chk");
        if (ck.length && ce) {
            const d = new Date(Math.max(...ck)), p2 = n => String(n).padStart(2, "0");
            ce.querySelector("b").textContent = p2(d.getDate()) + "." + p2(d.getMonth() + 1) + "." + d.getFullYear();
            ce.hidden = false
        }
        const HAS_DIRECT = {{hasDirect}}; /* false: страница без прямого поезда, все варианты идут как «с пересадкой» */
        /* LEADX: если среди вариантов есть пересадка на этой станции, подзаголовок страницы берётся из LEADM (с этой станцией) */
        const LEADX = "{{leadx}}", LEADM = {{leadm}};
        if (LEADX && LEADM && list.some(x => x.p.legs.length > 1 && (s => norm(s[s.length - 1].name).startsWith(norm(LEADX)))(x.p.legs[0].stops))) document.getElementById("lead").textContent = LEADM;
        const direct = HAS_DIRECT ? list.filter(x => x.p.legs.length === 1) : [], transfer = HAS_DIRECT ? list.filter(x => x.p.legs.length > 1) : list;
        /* блоки покупки: вариант ищем по перевозчику чешского поезда (EC/IC = ČD, RJ = RegioJet) и станции пересадки;
           время и номер поезда УЗ берём из остановок варианта, а не из шапки, чтобы не зависеть от ручных правок */
        const tm = s => (String(s).match(/\d{1,2}:\d{2}/) || [""])[0], isUz = L => !/^[A-Za-z]/.test(String(L.train).trim());
        const carOf = L => /^(EC|IC)\b/i.test(L.train.trim()) ? "cd" : /^RJ\b/i.test(L.train.trim()) ? "rj" : "";
        const blocks = [];
        document.querySelectorAll("#more h3[data-car]").forEach(h => {
            const x = list.find(x => {
                const L = x.p.legs, cz = L.find(l => !isUz(l)), s = L[0].stops;
                return L.length > 1 && cz && carOf(cz) === h.dataset.car && norm(s[s.length - 1].name).startsWith(norm(h.dataset.x))
            });
            if (!x) { blocks.push({blk: h.parentNode, k: [9, 0]}); return }
            const L = x.p.legs, last = L[L.length - 1].stops, ft = tm(L[0].stops[0].time) || x.h.ft, tt = tm(last[last.length - 1].time) || x.h.tt, u = L.find(isUz);
            h.insertAdjacentText("beforeend", " (" + h.dataset.dt.replace("{t1}", ft).replace("{t2}", tt) + ")");
            if (u) h.parentNode.querySelectorAll(".utr").forEach(e => e.textContent = String(u.train).trim().replace(/^№\s*/, "").toUpperCase());
            blocks.push({blk: h.parentNode, k: [0, list.indexOf(x)]})
        });
        /* блоки покупки идут в том же порядке, что и варианты на странице: в порядке списка вариантов */
        if (blocks.length) {
            const box = blocks[0].blk.parentNode;
            blocks.map((b, i) => Object.assign({i}, b)).sort((a, b) => a.k[0] - b.k[0] || a.k[1] - b.k[1] || a.i - b.i).forEach(b => box.appendChild(b.blk))
        }
        if (!list.length) {
            app.innerHTML = `<div class="panel"><h2>{{noopts.h}}</h2><p>{{noopts.p}}</p></div>`;
            return
        }
        app.innerHTML = ""/*D*/ + (direct.length ? `<h2 class="sub" style="margin-top:6px">{{direct.h}} <small>{{direct.s}}</small></h2><div class="direct direct-wrap" style="margin-top:16px">${direct.map(x => optHtml(x.o)).join("")}</div>` : "")
            + (direct.length && transfer.length ? `<aside class="ad wide" data-slot="mid" hidden></aside>` : "")/*/D*/
            + (() => {
            /* все варианты с пересадкой — одним списком (по времени отправления), без подзаголовков по станциям */
            if (!transfer.length) return "";
            const at = x => { const s = x.p.legs[0].stops; return norm(s[s.length - 1].name) }; /* станция первой пересадки */
            const bf = x => !SPLIT.length || SPLIT.some(s => s[2] && at(x).startsWith(norm(s[0]))); /* пограничный контроль — по карточке */
            const cards = transfer.map(x => { const c = optHtml(x.o); return bf(x) ? c.replace("<details ", '<details data-b="1" ') : c }).join("");
            const head = direct.length ? `<h2 class="sub">{{transfer.hx}}</h2>` : ""; /* заголовок только чтобы отделить от блока прямого поезда */
            return head + `<div class="cols${transfer.length === 1 ? " one" : ""}" style="margin-top:${head ? 16 : 6}px">${cards}</div>`
        })() + HOWBAR;
        /*D*//*C*/document.querySelectorAll(".direct .body").forEach(b => {
            b.classList.add("two");
            b.insertAdjacentHTML("beforeend", COACH)
        });/*/C*//*/D*/
        /*B*/document.querySelectorAll(".opt[data-b"+"] .swap").forEach(s => s.insertAdjacentHTML("afterend", `<div class="swap border">🛂 {{border}}</div>`));/*/B*/
    }).catch(() => {
        app.innerHTML = `<div class="panel"><h2>{{err.h}}</h2><p>{{err.p}}</p></div>`
    });
    const here = location.pathname.split("/").pop() || "index.html",
        others = ((window.CFG && CFG.PAGES) || []).filter(p => p.href !== here);
    document.getElementById("more").innerHTML = BUY + `<section class="panel"><h2>{{more.h}}</h2><div class="grid" style="margin-top:12px"><a class="btn" href="{{home}}#${BACK}">{{r_more}}</a>${others.map(p => `<a class="btn" href="${esc(p.href)}">${esc(trRoute(p.title))}</a>`).join("")}<a class="btn" href="{{home}}">{{more.all}}</a></div></section>`;
</script>
</body>
</html>
